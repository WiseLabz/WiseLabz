version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - funlen
  settings:
    funlen:
      # Ratchet; tighten further as oversized functions are split.
      lines: 150
      statements: 100
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
