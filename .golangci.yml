version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - forbidigo
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - funlen
  settings:
    forbidigo:
      analyze-types: true
      patterns:
        - p: 'slog\.(Error|Warn|Info|Debug|Log)\('
          msg: 'use httputil.Logger(ctx) instead of direct slog calls in internal/api'
          path: 'internal/api/(?!.*middleware\.go)'
    funlen:
      # Ratchet at the current maximum; tighten as #265/#266/#269 land.
      lines: 240
      statements: 118
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - funlen

formatters:
  enable:
    - gofmt
    - goimports
