          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
    put:
      tags: [dashboard]
      summary: Persist current user's widget layout (per-user, §8.5)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardLayout' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardLayout' }
  /dashboard/layout/admin-default:
