openapi: 3.0.3
info:
  title: WiseLabz REST API
  version: 0.1.0
  description: >
    Contract-first OpenAPI spec for the WiseLabz frontend. This is the source of
    truth the frontend generates against (orval) and mocks against (MSW) BEFORE the
    Go backend exists. The backend implements *to* this spec. Keep this file and
    docs/WS_CONTRACT.md in sync with each other.
servers:
  - url: /api
    description: Same-origin API (Vite proxies /api to the Go backend in dev)
  - url: /api/v1
    description: >
      Versioned alias of the same API. Every path is served identically under
      /api and /api/v1; /api is kept for existing clients.

tags:
  - name: auth
  - name: me
  - name: users
  - name: dashboard
  - name: connectors
  - name: compliance
  - name: docs
  - name: search
  - name: topology
  - name: chat
  - name: templates
  - name: changes
  - name: journal
  - name: attention
  - name: alerts
  - name: runbooks
  - name: findings
  - name: notifications
  - name: saved-views
  - name: settings
  - name: system
  - name: reports

security:
  - bearerAuth: []

paths:
  /topology/path:
    get:
      tags: [topology]
      summary: Trace a path through visible topology edges
      description: Edges are limited to connectors the caller can view and any API-key connector scope. With to, returns the shortest path over undirected edges and reports hops. Without to, follows directed edges from from (breadth-first, each node once; hops is omitted) and returns at most 1000 steps, setting truncated when more were reachable.
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - in: query
          name: to
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Visible path result
          content:
            application/json:
              schema:
                type: object
                required: [found, truncated, path]
                properties:
                  found: { type: boolean }
                  hops: { type: integer, minimum: 0, description: Edge count of the shortest path; present only when to is given. }
                  truncated: { type: boolean, description: True when a directed walk (no to) hit the 1000-step cap. }
                  path:
                    type: array
                    items: { $ref: '#/components/schemas/TopologyPathStep' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /topology/graph:
    get:
      tags: [topology]
      summary: Get the visible live topology graph
      description: Nodes are entity identities (merged identities excluded) plus connector service nodes and unresolved endpoints. Edges and members are limited to connectors the caller can view and any API-key connector scope; a connector filter naming a hidden connector returns the same empty graph as an unknown one. The response is capped at 2000 nodes and 5000 edges (no pagination) and sets truncated when the cap cut it short.
      parameters:
        - { in: query, name: connector, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: includeUnlinked, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Visible topology graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyGraph' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /search:
    get:
      tags: [search]
      summary: Search docs, runbooks, and connector entities
      description: Results are grouped and independently limited. Connector grants and API-key restrictions apply to docs and entities, including for admins. Runbooks are global and excluded by connector or kind filters; kind selects only entities.
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 500 }
        - in: query
          name: type
          schema: { type: string, enum: [doc, runbook, entity] }
        - in: query
          name: connector
          schema: { type: string, maxLength: 128 }
        - in: query
          name: kind
          schema: { type: string, maxLength: 100 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Grouped search results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        '400':
          description: Invalid search filters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /entities/{id}:
    get:
      tags: [search]
      summary: Get a visible entity identity and its related topology
      description: |
        Returns 404 unless the caller can view at least one member connector; a malformed id, an unknown id, a redirect loop and a missing grant all return the identical 404. Instance admins get no implicit access. All connector-derived fields are filtered by viewer grants and API-key restrictions.

        `kind` and `name` come from the first active visible member (a gone member only when none is active). `members` lists every visible member, active first, with `goneAt` on departed ones. `neighbors`, `relatedByIp`, `findings`, `onReportingConnectors` and `runbooks` only consider active visible members and are capped (200 edges, 50 findings, 100 runbook steps). `findings` and `onReportingConnectors` contain open findings only.

        `history` is derived from snapshot diffs: for each visible member connector the 30 most recent snapshots are compared pairwise, and at most 100 changes are returned, newest first. `at` is the fetch time of the newer snapshot of the pair, `old` the value in the older snapshot and `new` the value in the newer one.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Visible entity details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntityDetail' }
        '404':
          description: Entity not found or not visible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  # ───────────────────────── auth ─────────────────────────
  /auth/providers:
    get:
      tags: [auth]
      summary: List enabled auth providers (local + OIDC) for the login screen
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviders' }
  /auth/login:
    post:
      tags: [auth]
      summary: Local username/password login
      description: >
        On success returns a short-lived access token in the body and sets the
        refresh token as an HttpOnly; Secure; SameSite=Strict cookie (§8.7).
        A user with a confirmed second factor (#279) instead gets
        `LoginMfaRequired` — no session yet — and must finish with POST
        /auth/login/mfa. A user the require_2fa policy covers but who hasn't
        enrolled gets a normal session plus `mfaEnrollmentRequired: true`,
        confined to the enrollment allowlist until they enroll.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthSession'
                  - $ref: '#/components/schemas/LoginMfaRequired'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/login/mfa:
    post:
      tags: [auth]
      summary: Finish a login that required a second factor
      description: >
        Second step of login for a user with a confirmed factor (#279).
        Exactly one of `totp` or `recoveryCode` proves the second factor;
        failures count toward the same lockout as a bad password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginMfaRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/login/mfa/webauthn/begin:
    post:
      tags: [auth]
      summary: Begin a WebAuthn second-factor login ceremony
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: WebAuthn is unavailable or not enrolled }
  /auth/oidc/callback:
    post:
      tags: [auth]
      summary: Exchange an OIDC authorization code for a WiseLabz session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OidcCallbackRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Silent refresh — mints a new access token from the refresh cookie
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the refresh token and clear the cookie
      responses:
        '204': { description: No Content }
  /auth/elevate:
    post:
      tags: [auth]
      summary: Step-up re-authentication for a single destructive action
      description: >
        Re-authenticates the current operator (password, or TOTP when configured)
        and mints a short-lived elevation token scoped to one destructive action
        (ARCHITECTURE.md 2026-06-27). The token is replayed in the `X-Elevation-Token`
        header on the destructive request (e.g. connector removal). It is bound to
        the session that earned it and to `target`, and is spent by one request. Only required
        when `stepUpForDestructive` is enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElevationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElevationToken' }
        '400':
          description: >
            The account signs in through an OIDC provider and has no password;
            use `code: "use_oidc_reauth"` to route the client to
            POST /auth/elevate/oidc/begin instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Forbidden (API keys cannot reach /auth/elevate*) }
  /auth/elevate/methods:
    get:
      tags: [auth]
      summary: Which step-up method(s) POST /auth/elevate expects
      description: >
        `["password"]` for a local account without a confirmed factor,
        `["totp","recovery"]` once one is confirmed (#279 part 1), or
        `["oidc"]` for an account that signs in through an identity provider
        (#279 part 3). PR 2 appends `"webauthn"` alongside totp/recovery.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [methods]
                properties:
                  methods:
                    type: array
                    items: { type: string, enum: [password, totp, recovery, webauthn, oidc] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/elevate/webauthn/begin:
    post:
      tags: [auth]
      summary: Begin WebAuthn step-up for one action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string }
      responses:
        '200':
          description: PublicKeyCredentialRequestOptions envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '409': { description: WebAuthn is unavailable or not enrolled }
  /auth/elevate/oidc/begin:
    post:
      tags: [auth]
      summary: Start OIDC step-up re-authentication (#279 part 3)
      description: >
        For a caller whose account signs in through an IdP and has no password
        to confirm with POST /auth/elevate. Returns an authorize URL — opened
        in a popup — that forces the IdP to re-prompt for credentials
        (`prompt=login`, `max_age=0`) instead of silently reusing an existing
        IdP session. Uses the normal `/auth/callback` redirect URL, so no new
        IdP redirect URI registration is needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, description: "The elevation action being requested, e.g. connector.delete" }
                target: { type: string, description: "ID of the resource the token is bound to, for actions on one (e.g. the user for user.delete)" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [authUrl]
                properties:
                  authUrl: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/elevate/oidc/complete:
    post:
      tags: [auth]
      summary: Finish OIDC step-up re-authentication (#279 part 3)
      description: >
        Exchanges the popup's authorization code, requires the re-authenticated
        `iss`/`sub` to match the caller's linked OIDC identity, and requires
        `auth_time` to be present and within 120s of now. Returns
        `401 {code: "oidc_reauth_unsupported"}` when the IdP omits `auth_time`.
        On success, mints the same elevation token POST /auth/elevate would.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElevationToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/api-keys:
    get:
      tags: [auth]
      summary: List the current user's API keys
      responses:
        '200':
          description: API keys without token material
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [auth]
      summary: Create an API key for the current user
      description: >
        The opaque token is returned once and cannot be retrieved again. When
        `stepUpForDestructive` is enabled, requires an `X-Elevation-Token` for
        action `apiKey.create`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Single-use elevation token from POST /auth/elevate for action `apiKey.create` (when step-up is on)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: Created; token is shown once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/api-keys/{id}:
    delete:
      tags: [auth]
      summary: Revoke one of the current user's API keys
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── me ─────────────────────────
  /me:
    get:
      tags: [me]
      summary: Current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      summary: Update own profile (display name, email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/password:
    post:
      tags: [me]
      summary: Change own password (local accounts only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: No Content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Forbidden (API keys cannot change the password) }
  /me/sessions:
    get:
      tags: [me]
      summary: List own active sessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
  /me/sessions/{sessionId}:
    delete:
      tags: [me]
      summary: Revoke one of own sessions
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '204': { description: No Content }

  # ───────────────────────── me / mfa (#279, local accounts only) ─────────────────────────
  /me/mfa:
    get:
      tags: [me]
      summary: List own MFA factors, recovery codes remaining, and whether 2FA is required
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/mfa/totp:
    post:
      tags: [me]
      summary: Begin enrolling a TOTP factor
      description: >
        Creates a pending factor (unusable for login/step-up until confirmed).
        The frontend renders `otpauthUrl` as a QR code client-side. Requires
        step-up elevation (action `mfa.manage`; a user with no factor elevates
        with their password), except for sessions confined to forced MFA
        enrollment. 400 `elevation_required` when the token is missing, 401
        when invalid, 403 for API keys.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: 'Optional label, e.g. "Phone"' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpEnrollment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Forbidden (API keys cannot reach /me/mfa/*) }
  /me/mfa/totp/{factorId}/confirm:
    post:
      tags: [me]
      summary: Confirm a pending TOTP factor with a code
      description: >
        On the user's first confirmed factor, also returns freshly generated
        recovery codes (shown once). If the caller's session was
        enrollment-only, also returns a fresh, fully-privileged token pair.
      parameters:
        - name: factorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 6-digit TOTP code }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpConfirmResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Factor already confirmed }
  /me/mfa/webauthn/register/begin:
    post:
      tags: [me]
      summary: Begin registering a security key or passkey
      description: >
        Requires step-up elevation (action `mfa.manage`; a user with no factor
        elevates with their password), except for sessions confined to forced
        MFA enrollment. 400 `elevation_required` when the token is missing, 401
        when invalid, 403 for API keys.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: PublicKeyCredentialCreationOptions envelope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnOptions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Forbidden (API keys cannot reach /me/mfa/*) }
        '409': { description: WebAuthn is unavailable }
  /me/mfa/webauthn/register/finish:
    post:
      tags: [me]
      summary: Finish registering a security key or passkey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebAuthnResponse' }
      responses:
        '200':
          description: Registered factor and optional first-factor recovery codes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpConfirmResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: WebAuthn is unavailable or credential already registered }
  /me/mfa/recovery-codes:
    post:
      tags: [me]
      summary: Regenerate recovery codes
      description: Requires step-up elevation (action `mfa.manage`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /me/mfa/factors/{factorId}:
    delete:
      tags: [me]
      summary: Remove one of own MFA factors
      description: >
        Requires step-up elevation (action `mfa.manage`). Refused with 409
        `mfa_required_by_policy` when this is the last factor and the
        require_2fa policy still covers this user. Removing the last factor
        also wipes recovery codes.
      parameters:
        - name: factorId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Last factor, still required by policy' }

  # ───────────────────────── users (admin) ─────────────────────────
  /users:
    get:
      tags: [users]
      summary: List users (operator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: Create / invite a user (operator)
      description: >
        When `stepUpForDestructive` is enabled, requires an `X-Elevation-Token`
        for action `user.create`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Single-use elevation token from POST /auth/elevate for action `user.create` (when step-up is on)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}:
    parameters: [{ $ref: '#/components/parameters/UserId' }]
    patch:
      tags: [users]
      summary: Update a user's role or status (operator)
      description: >
        When `stepUpForDestructive` is enabled, requires an `X-Elevation-Token`
        for action `user.update`, issued with this user's ID as `target`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Single-use elevation token from POST /auth/elevate for action `user.update` (when step-up is on)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [users]
      summary: Delete a user (operator)
      description: >
        Destructive. When `stepUpForDestructive` is enabled, requires a valid
        `X-Elevation-Token` from POST /auth/elevate; absent or expired tokens
        get a 403 `elevation-required`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /users/{userId}/reset-password:
    post:
      tags: [users]
      summary: Operator-triggered password reset
      description: >
        Destructive. When `stepUpForDestructive` is enabled, requires a valid
        `X-Elevation-Token` from POST /auth/elevate; absent or expired tokens
        get a 403 `elevation-required`.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /users/{userId}/reset-mfa:
    post:
      tags: [users]
      summary: Reset a user's two-factor authentication (operator)
      description: >
        Destructive. Deletes every factor and recovery code, revokes every
        session, and is audited (#279). When `stepUpForDestructive` is
        enabled, requires a valid `X-Elevation-Token` from POST
        /auth/elevate; absent or expired tokens get a 403 `elevation-required`.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── dashboard ─────────────────────────
  /dashboard/overview:
    get:
      tags: [dashboard]
      summary: Aggregate overview (status counts, recent changes, alert summary)
      parameters: [{ $ref: '#/components/parameters/DaysQuery' }]
