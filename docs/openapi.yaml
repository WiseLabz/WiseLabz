            schema: { $ref: '#/components/schemas/ConnectorCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connectors/schema:
    get:
      tags: [connectors]
      summary: Category/type field metadata used to render schema-driven forms
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorTypeSchema' }
  /compliance/schema:
    get:
      tags: [compliance]
      summary: Connector entity attribute catalog for compliance rules (admin only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /compliance/rules:
    get:
      tags: [compliance]
      summary: List compliance rules (admin only)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRulePage' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [compliance]
      summary: Create a compliance rule (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /compliance/rules/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [compliance]
      summary: Get a compliance rule (admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRule' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [compliance]
      summary: Replace a compliance rule (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [compliance]
      summary: Delete a compliance rule (admin only)
      responses:
        '204': { description: No Content }
        '404': { $ref: '#/components/responses/NotFound' }
  /compliance/rules/test:
    post:
      tags: [compliance]
      summary: Test an unsaved compliance rule without writing findings (admin only)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRuleTestResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /compliance/packs/{id}/install:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [compliance]
      summary: Install a built-in compliance rule pack, skipping rules whose name already exists (admin only)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ComplianceRulePackInstallResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}:
    parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
    get:
      tags: [connectors]
      summary: One connector
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [connectors]
      summary: Update a connector (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The connector is managed by config.yaml (`connector_managed`) or orphaned (`connector_orphaned`)' }
    delete:
      tags: [connectors]
      summary: Remove a connector (operator, destructive)
      description: >
        Destructive: cascades to the connector's snapshots and generated doc
        sections (see GET /removal-impact for the blast radius). When
        `stepUpForDestructive` is enabled, requires a valid `X-Elevation-Token`
        from POST /auth/elevate; absent or expired tokens get a 403
        `elevation-required`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
        '409': { description: 'The connector is managed by config.yaml (`connector_managed`); remove its entry there instead' }
  /connectors/{connectorId}/release:
    post:
      tags: [connectors]
      summary: Release an orphaned connector to UI management (operator)
      description: >
        A connector whose config.yaml entry was removed is disabled and marked
        `config-orphaned`. Releasing it sets `managedBy` back to `ui` so it can
        be edited normally; it stays disabled.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The connector is not orphaned (`connector_managed`)' }
  /connectors/{connectorId}/removal-impact:
    get:
      tags: [connectors]
      summary: Blast radius for removing this connector (operator)
      description: >
        Computes the concrete dependents a removal destroys, so the UI can state
        them exactly before the user commits (machine-honest confirm pattern).
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovalImpact' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/restart:
    post:
      tags: [connectors]
      summary: Preview or perform a service restart (operator, elevation-gated)
      description: >
        With `dryRun=true`, returns a restart preview from the latest stored
        service snapshot without touching the connector — no elevation token
        required. With `dryRun` absent or `false`, performs the real restart:
        requires a valid `X-Elevation-Token` for action `connector.restart`
        (from `POST /auth/elevate`), and 400s with `unsupported_operation` if
        the connector type has no restart capability. On success, records a
        `connector.restart` audit row; on failure, raises an `AlertRecord`
        instead of retrying (see ADR 0001).
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the restart without performing it; absent/false
            performs the real, elevation-gated restart.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.restart. Required only when dryRun is absent/false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity's SnapshotEntity.externalId (e.g. a VM ID,
                    container ID, or service name), or omitted for connectors
                    that manage a single implicit service. Also honored for
                    dry-run previews: when set and it matches an entity in
                    the latest snapshot, the preview's targetService is that
                    entity's name.
      responses:
        '200':
          description: Restart preview, or restart performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Bad request, missing elevation token, or the connector type
            doesn't support restart (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Restart failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/start:
    post:
      tags: [connectors]
      summary: Preview or perform a service start (operator, elevation-gated)
      description: >
        Same dry-run/elevation-gated-mutate shape as /restart (see ADR 0002):
        dryRun=true previews from the latest stored snapshot; absent/false
        performs the real start, requiring a valid X-Elevation-Token for
        action connector.start. 400s with unsupported_operation if the
        connector type has no start capability. On success, records a
        connector.start audit row; on failure, raises an AlertRecord.
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the start without performing it; absent/false
            performs the real, elevation-gated start.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.start. Required only when dryRun is absent/false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity's SnapshotEntity.externalId, or omitted for
                    connectors that manage a single implicit service. Also
                    honored for dry-run previews: when set and it matches an
                    entity in the latest snapshot, the preview's
                    targetService is that entity's name.
      responses:
        '200':
          description: Start preview, or start performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Bad request, missing elevation token, or the connector type
            doesn't support start (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Start failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/stop:
    post:
      tags: [connectors]
      summary: Preview or perform a service stop (operator, elevation-gated)
      description: >
        Same dry-run/elevation-gated-mutate shape as /restart (see ADR 0002):
        dryRun=true previews from the latest stored snapshot; absent/false
        performs the real stop, requiring a valid X-Elevation-Token for
        action connector.stop. estimatedDowntimeSeconds is 0 in the preview
        since a stop's downtime is indefinite until an explicit start. 400s
        with unsupported_operation if the connector type has no stop
        capability. On success, records a connector.stop audit row; on
        failure, raises an AlertRecord.
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the stop without performing it; absent/false
            performs the real, elevation-gated stop.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.stop. Required only when dryRun is absent/false.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity's SnapshotEntity.externalId, or omitted for
                    connectors that manage a single implicit service. Also
                    honored for dry-run previews: when set and it matches an
                    entity in the latest snapshot, the preview's
                    targetService is that entity's name.
      responses:
        '200':
          description: Stop preview, or stop performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Bad request, missing elevation token, or the connector type
            doesn't support stop (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: Stop failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/config-fields:
    get:
      tags: [connectors]
      summary: List a connector's whitelisted config-push fields
      description: >
        Returns the connector's WritableFields() (ADR 0003), or an empty
        array if the connector type doesn't implement config-push.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigField' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/config-push:
    post:
      tags: [connectors]
      summary: Push one whitelisted config field (operator, elevation-gated)
      description: >
        Field-level partial update per ADR 0003: requires a valid
        X-Elevation-Token for action connector.configPush. Snapshots the
        connector before the write, applies it, re-fetches, and diffs. On a
        verified match, records a connector.configPush audit row and returns
        the post-push snapshot. On mismatch, auto-reverts to previousValue
        and raises a critical AlertRecord (escalated further if the revert
        itself fails), returning 409. 400s with unsupported_operation if the
        connector doesn't implement config-push, or unsupported_field if
        fieldKey isn't in WritableFields().
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: X-Elevation-Token
          in: header
          required: true
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.configPush.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fieldKey, value]
              properties:
                entityRef:
                  type: string
                  description: >
                    Target entity ref, required when the field's
                    ConfigField.entityScope is true.
                fieldKey: { type: string }
                value: {}
                previousValue:
                  description: >
                    The field's currently-displayed value (read from GET
                    /{connectorId}/data before editing), used to revert if
                    the push doesn't verify.
      responses:
        '200':
          description: Config push verified; post-push snapshot returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSnapshot' }
        '400':
          description: >
            Bad request, missing elevation token, unsupported_operation, or
            unsupported_field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            config_push_mismatch — the push didn't verify; auto-revert was
            attempted (see the new critical AlertRecord for whether it
            succeeded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Config push failed upstream (write itself errored).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connectors/{connectorId}/data:
    get:
      tags: [connectors]
      summary: Latest fetched service snapshot (live data)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/uptime:
    get:
      tags: [connectors]
      summary: Availability % and MTTR over 24h/7d/30d windows
      description: >
        Computed from the health_checks time series recorded by POST
        /connectors/{connectorId}/health. Availability is time-weighted
        between consecutive checks, and MTTR (mean time to recovery) is the
        mean time from an "offline" check to the next check that isn't,
        counting only outages that both started and recovered inside each
        window. Time inside a maintenance window counts as neither uptime
        nor downtime, and an offline stretch fully inside one is not an outage.
        Checks are recorded by a scheduler (health.cron_expr, default every
        60s) as well as by manual checks.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UptimeReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/uptime/history:
    get:
      tags: [connectors]
      summary: Downsampled health history buckets for sparklines
      description: >
        Health checks grouped into fixed-width buckets (24h = 15m, 7d = 1h,
        30d = 6h), oldest first, each with its worst status and mean latency.
        Buckets with no checks are omitted.
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - name: window
          in: query
          required: false
          schema: { type: string, enum: ['24h', '7d', '30d'], default: '24h' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UptimeHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /uptime:
    get:
      tags: [connectors]
      summary: Fleet availability for the connectors the caller can view
      description: >
        Per-connector availability and MTTR over one window, restricted to
        connectors the caller holds at least a viewer grant on (and any API-key
        connector restriction).
      parameters:
        - name: window
          in: query
          required: false
          schema: { type: string, enum: ['24h', '7d', '30d'], default: '7d' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetUptime' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /connectors/{connectorId}/test:
    post:
      tags: [connectors]
      summary: Test connection without saving
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
  /connectors/{connectorId}/health:
    post:
      tags: [connectors]
      summary: Cheap connectivity check (no fetch, no snapshot, no docs); persists status
      description: >
        Runs the connector's Validate step only and saves the resulting
        online/degraded/offline status, independently of running a full sync.
        Unlike /test, this call updates the connector's persisted status.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthCheckResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/sync:
    post:
      tags: [connectors]
      summary: Trigger a sync for one connector (progress streams over /ws)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: array
                  items: { type: string }
                  description: >-
                    Optional selective-fetch hint (e.g. ["vms","storage"]) for a
                    partial sync. A connector type that doesn't support selective
                    fetch ignores it and fetches everything.
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJobRef' }
  /connectors/{connectorId}/syncs:
    get:
      tags: [connectors]
      summary: Recent sync run history for one connector (newest first)
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          headers:
            X-Next-Cursor:
              description: >-
                Cursor for the next keyset page, present only when `cursor` was
                sent and more rows follow. This response body is a bare array,
                so the cursor rides on a header rather than an envelope field.
              required: false
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SyncRun' }
  /connectors/{connectorId}/snapshots:
    get:
      tags: [connectors]
      summary: Snapshot history for one connector (newest first)
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          headers:
            X-Next-Cursor:
              description: Cursor for the next keyset page when more rows follow.
              required: false
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SnapshotSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/snapshots/diff:
    get:
      tags: [connectors]
      summary: Compare two snapshots of one connector
      description: Without format, returns JSON for the browser. With format, downloads an attachment and records an audit event.
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: from
          in: query
          required: true
          schema: { type: string }
        - name: to
          in: query
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv, md, html] }
      responses:
        '200':
          description: JSON body, or an attachment when format is set
          headers:
            Content-Disposition:
              description: Attachment filename when format is set.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotDiff' }
            text/csv:
              schema: { type: string }
            text/markdown:
              schema: { type: string }
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/snapshots/{snapshotId}:
    get:
      tags: [connectors]
      summary: Full snapshot belonging to one connector
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotFull' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/bulk-sync:
    post:
      tags: [connectors]
      summary: Trigger a sync for an explicit list of connectors in one request
      description: >
        Fans out an async sync per connector (same as POST
        /connectors/{connectorId}/sync); progress for each streams over /ws.
        The caller must supply an explicit list of connector IDs. One bad ID
        never aborts the batch — the response reports a per-item outcome, and
        one audit record is written per successfully-started item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorBulkSyncRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBulkSyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /connectors/bulk-reauth:
    post:
      tags: [connectors]
      summary: Refresh credentials for an explicit list of connectors in one request
      description: >
        For each connector implementing credential refresh, refreshes and
        persists its credentials. Not elevation-gated (matches how
        single-connector sync/re-auth aren't gated today either). One bad ID
        never aborts the batch; one audit record is written per
        successfully-refreshed item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorBulkReauthRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBulkReauthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /connectors/bulk-restart:
    post:
      tags: [connectors]
      summary: Restart an explicit list of connectors in one request
      description: >
        Gated by X-Elevation-Token, action `connector.bulkRestart` — one
        elevation covers the whole batch, not one per item. One bad ID never
        aborts the batch; one audit record is written per
        successfully-restarted item.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorBulkRestartRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorBulkRestartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /connectors/{connectorId}/enabled:
    put:
      tags: [connectors]
      summary: Enable/disable a connector
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connector' }
        '409': { description: 'The connector is managed by config.yaml (`connector_managed`) or orphaned (`connector_orphaned`)' }

  /connectors/{connectorId}/maintenance-window:
    get:
      tags: [connectors]
      summary: Get a connector's active maintenance window, if any
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/MaintenanceWindow' }]
                nullable: true
    post:
      tags: [connectors]
      summary: Open a time-boxed maintenance window on a connector
      description: >
        While active, the scheduler skips this connector and drift
        alerting/change-record creation from any sync (scheduled or manual)
        is suppressed, though snapshots keep being saved. Operator-only, no
        step-up elevation required — reversible and time-boxed.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenMaintenanceWindowRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Close a connector's active maintenance window early (no-op if none)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [closed]
                properties:
                  closed: { type: boolean }

  /connectors/{connectorId}/golden-snapshot:
    get:
      tags: [connectors]
      summary: Get a connector's pinned golden snapshot, if any
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/GoldenSnapshot' }]
                nullable: true
    post:
      tags: [connectors]
      summary: Pin a snapshot as the connector's golden configuration baseline
      description: >
        Later syncs are compared against this snapshot (not just the
        immediately previous one) and a config_drift quality finding is
        raised when attributes deviate. Operator-only.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinGoldenSnapshotRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoldenSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Unpin a connector's golden snapshot (no-op if none)
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [unpinned]
                properties:
                  unpinned: { type: boolean }

  /connectors/maintenance-windows:
    get:
      tags: [connectors]
      summary: List every currently active maintenance window, across all connectors
      description: Used by the services list badge to avoid an N+1 fetch per row.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceWindow' }

  /sync:
    post:
      tags: [connectors]
      summary: Trigger a global sync of all connectors
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJobRef' }

  # ───────────────────────── docs ─────────────────────────
  /docs:
    get:
      tags: [docs]
      summary: Flat searchable list of all docs (any authenticated user)
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocPage' }
    post:
      tags: [docs]
      summary: Create a human doc (lab admin or connector operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocCreate' }
      responses:
        '201':
          description: Created with revision one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /docs/trash:
    get:
      tags: [docs]
      summary: List deleted docs (instance admin)
      responses:
        '200':
          description: Deleted docs including deletion batch metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Doc' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /docs/export:
    get:
      tags: [docs]
      summary: Download a permission-scoped offline Lab Book
      description: Includes only active docs the signed-in caller may view. HTML embeds Mermaid, CSS and images for offline use; md.zip preserves hierarchy and attachments for Markdown import.
      parameters:
        - in: query
          name: format
          required: true
          schema: { type: string, enum: [html, md.zip] }
      responses:
        '200':
          description: Portable Lab Book
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Dated lab-book filename with attachment disposition
          content:
            text/html:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /docs/import:
    post:
      tags: [docs]
      summary: Stage a Markdown/Obsidian vault zip and preview the import (instance admin)
      description: >-
        Stages the zip (100 MB cap; at most 2000 entries, 500 MB unzipped and a
        100:1 compression ratio) for one hour and returns the docs it would
        create. Nothing is written to the docs until the commit.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Staged; preview of the import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocImportPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Upload exceeds 100 MB or the archive expands beyond 500 MB }
  /docs/import/{importId}/commit:
    post:
      tags: [docs]
      summary: Create every doc of a staged import in one transaction (instance admin)
      parameters:
        - { name: importId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created docs, parents first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocImportCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A connector named by the import no longer exists }
  /docs/{docId}/restore:
    post:
      tags: [docs]
      summary: Restore a deleted subtree batch (instance admin)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: Restored root doc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            The batch holds a generated lab doc (e.g. Lab Topology) and a newer
            active generated lab doc with the same title exists
  /docs/tree:
    get:
      tags: [docs]
      summary: Hierarchical doc tree (lab root + per-service children)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocNode' }
  /docs/service/{connectorId}:
    get:
      tags: [docs]
      summary: The doc node for a given service
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docs/{docId}:
    parameters: [{ $ref: '#/components/parameters/DocId' }]
    get:
      tags: [docs]
      summary: Rendered doc node
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [docs]
      summary: Save doc content (creates a new version; editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocSave' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Version conflict — baseVersion is stale. Body is the current server-side
            Doc (content + currentVersion) so the client can reconcile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
    patch:
      tags: [docs]
      summary: Rename or re-parent a doc in the same scope (maximum depth five)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocPatch' }
      responses:
        '200':
          description: Updated metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [docs]
      summary: Soft-delete doc and its active descendants
      responses:
        '204': { description: Subtree moved to trash }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docs/{docId}/attachments:
    parameters: [{ $ref: '#/components/parameters/DocId' }]
    get:
      tags: [docs]
      summary: List doc attachments with fifteen-minute signed URLs (viewer)
      responses:
        '200':
          description: Attachments owned by this doc
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocAttachment' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [docs]
      summary: Upload a sniffed image, PDF or text attachment (operator)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocAttachment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Attachment exceeds configured size limit (25 MiB default) }
        '415': { description: 'Unsupported content, including SVG' }
  /docs/{docId}/attachments/{aid}:
    parameters:
      - { $ref: '#/components/parameters/DocId' }
      - name: aid
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [docs]
      summary: Delete doc attachment metadata (operator)
      responses:
        '204': { description: Deleted; unreferenced bytes are garbage-collected }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /attachments/{aid}/raw:
    get:
      tags: [docs]
      security: []
      summary: Read attachment bytes using a signed URL
      parameters:
        - name: aid
          in: path
          required: true
          schema: { type: string }
        - name: exp
          in: query
          required: true
          schema: { type: string }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sniffed bytes; private cache, nosniff and sandbox CSP
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Partial content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docs/{docId}/versions:
    get:
      tags: [docs]
      summary: Version history list for a doc node
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocVersionMeta' }
  /docs/{docId}/versions/{rev}:
    get:
      tags: [docs]
      summary: A specific doc revision
      parameters:
        - { $ref: '#/components/parameters/DocId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocVersion' }
  /docs/{docId}/versions/{rev}/restore:
    post:
      tags: [docs]
      summary: Restore a past revision as a new current version (editor+)
      parameters:
        - { $ref: '#/components/parameters/DocId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
  /docs/{docId}/ai-suggest:
    post:
      tags: [docs]
      summary: Request an AI suggestion for the doc (result streams via doc.ai_suggestion WS)
      description: Only available when the AI module is enabled (§2). Returns a request id to correlate with WS events.
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestRequest' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestRef' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /docs/{docId}/lock:
    parameters: [{ $ref: '#/components/parameters/DocId' }]
    get:
      tags: [docs]
      summary: Current advisory edit lock on the doc, if any (any authenticated user)
      responses:
        '200':
          description: OK — empty object if unlocked/expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocLock' }
    post:
      tags: [docs]
      summary: Acquire or renew the advisory edit lock (editor+). Advisory only — never blocks Save.
      responses:
        '200':
          description: Lock acquired or renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocLock' }
        '409':
          description: Lock held by another user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocLock' }
  /docs/{docId}/lock/release:
    post:
      tags: [docs]
      summary: Release the advisory edit lock if held by the caller (editor+)
      parameters: [{ $ref: '#/components/parameters/DocId' }]
      responses:
        '200':
          description: OK
  /docs/edit-proposals:
    get:
      tags: [docs]
      summary: Doc edit proposals the caller can review (operator on the doc's connector; instance admin for lab-wide docs)
      description: >
        Proposals are created by the MCP `propose_doc_edit` tool and never applied until approved.
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to pending.
          schema: { type: string, enum: [pending, approved, rejected, all] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocEditProposalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /docs/edit-proposals/{proposalId}:
    get:
      tags: [docs]
      summary: Get one proposal including its proposed content (operator on the doc's connector; instance admin for lab-wide docs)
      parameters: [{ $ref: '#/components/parameters/ProposalId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocEditProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docs/edit-proposals/{proposalId}/approve:
    post:
      tags: [docs]
      summary: Approve a proposal, applying it as a new doc version (operator)
      parameters: [{ $ref: '#/components/parameters/ProposalId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocEditProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Either the proposal was already reviewed (error body), or the doc changed since the
            proposal's base version (body is the current Doc; the proposal stays pending).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Doc' }
                  - { $ref: '#/components/schemas/Error' }
  /docs/edit-proposals/{proposalId}/reject:
    post:
      tags: [docs]
      summary: Reject a proposal without changing the doc (operator)
      parameters: [{ $ref: '#/components/parameters/ProposalId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocEditProposal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Proposal already reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /docs/template-schema:
    get:
      tags: [docs]
      summary: Available templateData field paths and filter functions, for editor reference
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateSchema' }
  /docs/generate:
    post:
      tags: [docs]
      summary: Generate a doc from a template applied to a connector's live snapshot
      operationId: postDocsGenerate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId, connectorId]
              properties:
                templateId: { type: string }
                connectorId: { type: string }
      responses:
        '201':
          description: Doc generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Template or connector not found }

  /docs/topology:
    post:
      tags: [docs]
      summary: (Re)generate the single lab-wide topology doc from every connector's latest snapshot
      operationId: postDocsTopology
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Topology doc generated or refreshed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateResult' }

  # ───────────────────────── chat ─────────────────────────
  /chat/conversations:
    get:
      tags: [chat]
      summary: List the caller's "ask your lab" chat conversations, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatConversation' }
    post:
      tags: [chat]
      summary: Start a new chat conversation scoped to a doc or the whole lab
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatConversationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversation' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /chat/conversations/{id}:
    get:
      tags: [chat]
      summary: A conversation plus its full message history
      parameters:
        - { $ref: '#/components/parameters/ChatConversationId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatConversationDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /chat/conversations/{id}/messages:
    post:
      tags: [chat]
      summary: Ask a question in the conversation; retrieves matching doc sections and answers via the configured AI provider
      parameters:
        - { $ref: '#/components/parameters/ChatConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMessageCreate' }
      responses:
        '200':
          description: OK — the assistant's reply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── templates ─────────────────────────
  /templates:
    get:
      tags: [templates]
      summary: List templates
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Template' }
    post:
      tags: [templates]
      summary: Create a template (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /templates/{templateId}:
    parameters: [{ $ref: '#/components/parameters/TemplateId' }]
    get:
      tags: [templates]
      summary: One template
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [templates]
      summary: Update a template (editor+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
    delete:
      tags: [templates]
      summary: Delete a template (editor+)
      description: >
        Destructive. When `stepUpForDestructive` is enabled, requires a valid
        `X-Elevation-Token` from POST /auth/elevate; absent or expired tokens
        get a 403 `elevation-required`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Elevation token from POST /auth/elevate (when step-up is on)
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/ElevationRequired' }
  /templates/{templateId}/preview:
    post:
      tags: [templates]
      summary: Preview this template's impact without persisting changes
      description: >
        Lists matching connectors and, when connectorId is supplied, renders a
        detailed preview. This operation does not create or update documents or versions.
      parameters: [{ $ref: '#/components/parameters/TemplateId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                connectorId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePreviewResult' }
  /templates/{templateId}/versions:
    get:
      tags: [templates]
      summary: Version history list for a template
      parameters: [{ $ref: '#/components/parameters/TemplateId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateVersionMeta' }
  /templates/{templateId}/versions/{rev}:
    get:
      tags: [templates]
      summary: A specific template revision
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateVersion' }
  /templates/{templateId}/versions/{rev}/restore:
    post:
      tags: [templates]
      summary: Restore a past template revision as a new current version (editor+)
      parameters:
        - { $ref: '#/components/parameters/TemplateId' }
        - { $ref: '#/components/parameters/Rev' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }

  # ───────────────────────── changes ─────────────────────────
  /timeline:
    get:
      tags: [journal]
      summary: Merged lab journal (always cursor paginated)
      parameters:
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Cursor' }
        - name: connectorId
          in: query
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string, format: date-time }
        - name: before
          in: query
          schema: { type: string, format: date-time }
        - name: kinds
          in: query
          description: Comma-separated change, sync, alert, doc, journal or audit
          schema: { type: string }
        - name: allSyncRuns
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Visible lab activity, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }
        '400':
          description: Invalid filter or cursor
  /journal:
    post:
      tags: [journal]
      summary: Create a manual entry (connector operator or lab-wide instance admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '400':
          description: Invalid entry or link scope
        '403':
          description: Insufficient permissions
        '404':
          description: Linked resource not found
  /journal/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [journal]
      summary: Replace an entry (author or admin with read access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JournalEntryInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalEntry' }
        '400':
          description: Invalid entry or link scope
        '403':
          description: Insufficient permissions
        '404':
          description: Entry or linked resource not found
    delete:
      tags: [journal]
      summary: Delete an entry (author or admin with read access)
      responses:
        '204':
          description: Deleted
        '403':
          description: Insufficient permissions
        '404':
          description: Entry not found
  /changes:
    get:
      tags: [changes]
      summary: Global changelog feed
      parameters:
        - { $ref: '#/components/parameters/ServiceIdQuery' }
        - name: severity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangePage' }
  /changes/{changeId}:
    parameters: [{ $ref: '#/components/parameters/ChangeId' }]
    get:
      tags: [changes]
      summary: One change with before/after diff
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /changes/{changeId}/ack:
    post:
      tags: [changes]
      summary: Acknowledge a change
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
  /changes/{changeId}/dismiss:
    post:
      tags: [changes]
      summary: Dismiss a change
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
  /changes/{changeId}/resolve-doc:
    post:
      tags: [changes]
      summary: Resolve a doc_conflict or doc_adopt change
      description: >
        `accept` applies the generated text (a conflict's block body, or the
        whole generated layout for an adopt). `keep` keeps the human version;
        for a conflict this detaches the block so sync never touches it again.
        Requires an operator grant on the change's connector. The change is
        acknowledged on success.
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveDocChange' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not an open doc change, the block is gone, or the doc changed meanwhile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /changes/bulk-resolve:
    post:
      tags: [changes]
      summary: Acknowledge or dismiss an explicit list of changes in one request
      description: >
        Bulk review action for low-risk changes (issue #27). The caller must
        supply an explicit list of change IDs — there is no "all matching
        the current filter" option, by design. "Low-risk" is enforced
        server-side as severity != critical; the client's selection is never
        trusted. Each ID is independently verified (exists, not critical)
        and resolved on its own — one bad ID never aborts the batch. The
        response reports a per-item outcome, and one audit record is written
        per successfully-resolved item.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkResolveRequest' }
      responses:
        '200':
          description: OK — per-item outcomes (individual items may still have failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkResolveResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /changes/{changeId}/ai-update:
    post:
      tags: [changes]
      summary: Trigger an AI doc update for this change (AI module must be enabled)
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestRef' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /changes/{changeId}/explain:
    post:
      tags: [changes]
      summary: Generate (or return the cached) plain-English narration for a change
      description: >
        On-demand narration of why this change matters, separate from the
        AI doc-update suggestion. The first call generates and persists the
        narration on the change record; subsequent calls return the cached
        text without re-invoking the AI provider.
      parameters: [{ $ref: '#/components/parameters/ChangeId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: AI module disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: AI provider failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── alerts ─────────────────────────
  /alerts:
    get:
      tags: [alerts]
      summary: Alert center list
      parameters:
        - name: severity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/DaysQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
  /alerts/{alertId}:
    parameters: [{ $ref: '#/components/parameters/AlertId' }]
    get:
      tags: [alerts]
      summary: One alert
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '404': { $ref: '#/components/responses/NotFound' }
  /alerts/{alertId}/resolve:
    post:
      tags: [alerts]
      summary: Resolve an alert
      parameters: [{ $ref: '#/components/parameters/AlertId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /alerts/{alertId}/dismiss:
    post:
      tags: [alerts]
      summary: Dismiss an alert
      parameters: [{ $ref: '#/components/parameters/AlertId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /alerts/{alertId}/snooze:
    post:
      tags: [alerts]
      summary: Snooze an alert
      parameters: [{ $ref: '#/components/parameters/AlertId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [until]
              properties:
                until: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /alerts/{alertId}/draft-runbook:
    post:
      tags: [alerts]
      summary: Draft a runbook from an alert (operator; deterministic template, nothing is persisted)
      description: >
        Builds a starting-point runbook from the alert, its linked change and any runbook already
        bound to the target. No AI is involved, so this works with the AI module disabled.
      parameters: [{ $ref: '#/components/parameters/AlertId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookDraft' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /alerts/bulk-snooze:
    post:
      tags: [alerts]
      summary: Snooze multiple alerts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertBulkSnoozeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertBulkSnoozeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ───────────────────────── attention queue ─────────────────────────
  /attention:
    get:
      tags: [attention]
      summary: Recovery book attention queue — merged alerts and findings
      description: >
        Aggregates open alerts and findings, sorted by severity then age.
        Each item can be resolved via the alert or finding resolution endpoints.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/DaysQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttentionPage' }

  # ───────────────────────── runbooks ─────────────────────────
  /runbooks:
    get:
      tags: [runbooks]
      summary: List runbooks, optionally filtered by change type or alert severity
      description: >
        `changeType`, `alertSeverity`, and `findingCheckType` are mutually
        exclusive filters — pass at most one. `changeType` matches
        target_type=change_type / target_value=<changeType>;
        `alertSeverity` matches target_type=alert_severity /
        target_value=<alertSeverity>; `findingCheckType` matches
        target_type=finding_check_type / target_value=<findingCheckType>.
        With none given, returns all runbooks.
      parameters:
        - name: changeType
          in: query
          required: false
          schema: { type: string }
          description: 'Filter to runbooks targeting this change type, e.g. vm.created. Mutually exclusive with alertSeverity and findingCheckType.'
        - name: alertSeverity
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Severity' }
          description: Filter to runbooks targeting this alert severity. Mutually exclusive with changeType and findingCheckType.
        - name: findingCheckType
          in: query
          required: false
          schema: { type: string }
          description: Filter to runbooks targeting this quality finding check type, e.g. stale. Mutually exclusive with changeType and alertSeverity.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [runbooks]
      summary: Create a runbook (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunbookCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /runbooks/{runbookId}:
    parameters: [{ $ref: '#/components/parameters/RunbookId' }]
    get:
      tags: [runbooks]
      summary: One runbook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [runbooks]
      summary: Update a runbook (operator)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunbookUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [runbooks]
      summary: Delete a runbook (operator)
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runbooks/{runbookId}/steps/{stepId}/execute:
    parameters:
      - { $ref: '#/components/parameters/RunbookId' }
      - { $ref: '#/components/parameters/RunbookStepId' }
    post:
      tags: [runbooks]
      operationId: executeRunbookStep
      summary: Execute (or preview) one runbook step's lifecycle operation
      description: >
        Resolves the target connector, verb, and entityRef from the stored
        step — the request body is ignored — and runs the exact same
        dry-run-preview / elevation-gated-mutate path as the connector-level
        restart/start/stop endpoints (see ADR 0001/0002). Linking a step
        grants nothing on its own: the caller must additionally hold at
        least an operator grant on the step's connector, and a real (non
        dry-run) execution still requires a valid X-Elevation-Token for
        action `connector.<verb>`. On success, records a `connector.<verb>`
        audit row whose detail includes this runbookId/stepId in addition
        to entityRef.
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: boolean }
          description: >
            true previews the operation without performing it; absent/false
            performs the real, elevation-gated operation.
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: >
            Elevation token from POST /auth/elevate, scoped to action
            connector.<verb>. Required only when dryRun is absent/false.
      responses:
        '200':
          description: Step preview, or step performed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestartPreview' }
        '400':
          description: >
            Missing elevation token, or the connector type doesn't support
            the step's verb (`unsupported_operation`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/ElevationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: The operation failed upstream; an AlertRecord was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ───────────────────────── quality findings ─────────────────────────
  /findings:
    get:
      tags: [findings]
      summary: Documentation quality findings
      parameters:
        - name: connectorId
          in: query
          required: false
          schema: { type: string }
        - name: checkType
          in: query
          required: false
          schema: { $ref: '#/components/schemas/QualityCheckType' }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/QualityFindingStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityFindingPage' }
  /findings/{findingId}:
    parameters: [{ $ref: '#/components/parameters/FindingId' }]
    get:
      tags: [findings]
      summary: One documentation quality finding
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityFinding' }
        '404': { $ref: '#/components/responses/NotFound' }
  /findings/{findingId}/resolve:
    post:
      tags: [findings]
      summary: Resolve a documentation quality finding (operator)
      parameters: [{ $ref: '#/components/parameters/FindingId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityFinding' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────── notification center ────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: List the current user's in-app notifications
      parameters:
        - name: unread
          in: query
          required: false
          schema: { type: boolean }
          description: When true, return only unread notifications (total reflects the unread count).
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all of the current user's notifications as read
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{notificationId}/read:
    post:
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/deliveries:
    get:
      tags: [notifications]
      summary: List per-channel notification delivery attempts — operator
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, sent, failed] }
          description: Filter by delivery status.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationDeliveryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── saved views ─────────────────────────
  /saved-views:
    get:
      tags: [saved-views]
      summary: List the current user's saved views for one list surface (docs/SAVED_VIEWS.md)
      parameters:
        - name: surface
          in: query
          required: true
          schema: { $ref: '#/components/schemas/SavedViewSurface' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [saved-views]
      summary: Save the current filter state of a list surface under a name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedViewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /saved-views/{savedViewId}:
    delete:
      tags: [saved-views]
      summary: Delete one of the current user's saved views
      parameters:
        - { name: savedViewId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: No Content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── settings ─────────────────────────
  /auth/config:
    get:
      tags: [settings]
      summary: Auth config — operator (read-only view)
      description: >
        OIDC providers are defined entirely in config file / env (decision: hybrid-C
        strict). This endpoint returns provider metadata for display only — issuer,
        clientId, and secret are never writable via the API and the secret is never
        returned (`secretConfigured` reflects presence). Only the toggles below are
        mutable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [settings]
      summary: Update mutable auth settings — operator (toggles + token TTLs only)
      description: >
        Cannot create/edit OIDC providers or touch any credential. Accepts only
        local-login enablement and token lifetimes. When `stepUpForDestructive`
        is enabled, requires an `X-Elevation-Token` for action `authConfig.update`.
      parameters:
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Single-use elevation token from POST /auth/elevate for action `authConfig.update` (when step-up is on)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSettingsUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/providers/{providerId}/enabled:
    put:
      tags: [settings]
      summary: Enable/disable a file-defined OIDC provider — operator
      description: >
        The only per-provider mutation exposed. Persists an enable/disable flag in the
        app DB; the provider definition itself stays in config/env. When
        `stepUpForDestructive` is enabled, requires an `X-Elevation-Token` for
        action `authProvider.toggle`, issued with the provider ID as `target`.
      parameters:
        - { name: providerId, in: path, required: true, schema: { type: string } }
        - name: X-Elevation-Token
          in: header
          required: false
          schema: { type: string }
          description: Single-use elevation token from POST /auth/elevate for action `authProvider.toggle` (when step-up is on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OidcProvider' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /ai/config:
    get:
      tags: [settings]
      summary: AI module config — admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConfig' }
    put:
      tags: [settings]
      summary: Update AI module config — admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiConfig' }
  /ai/config/test:
    post:
      tags: [settings]
      summary: Test the AI provider connection — admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }
  /ai/config/fallback-providers:
    get:
      tags: [settings]
      summary: Ordered fallback providers, tried in order after the primary provider fails — admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiFallbackProvider' }
    put:
      tags: [settings]
      summary: Replace the whole ordered fallback provider list — admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/AiFallbackProvider' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AiFallbackProvider' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /notifications/config:
    get:
      tags: [settings]
      summary: Notification channels + event×channel routing matrix — admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationConfig' }
    put:
      tags: [settings]
      summary: Update notification config — admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationConfig' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationConfig' }
  /notifications/config/test:
    post:
      tags: [settings]
      summary: Send a test notification on a channel — admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { $ref: '#/components/schemas/NotificationChannelType' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestResult' }

  # ───────────────────────── system ─────────────────────────
  /system/info:
    get:
      tags: [system]
      summary: Instance info (version, sync schedule, integrations) — operator
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
  /system/audit:
    get:
      tags: [system]
      summary: >-
        Audit trail (docs/AUDIT.md) — operator. Covers connector changes and
        syncs, elevation, auth settings changes, and document restores;
        written only after the action succeeds.
      parameters:
        - name: action
          in: query
          required: false
          schema: { type: string }
          description: Exact match, e.g. `connector.create`
        - name: targetType
          in: query
          required: false
          schema: { type: string }
          description: Exact match, e.g. `connector`, `doc`
        - name: createdAfter
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only records with createdAt >= this RFC3339 timestamp
        - name: createdBefore
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only records with createdAt <= this RFC3339 timestamp
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/audit/export:
    get:
      tags: [system]
      summary: >-
        Export the full (unpaginated) set of audit records matching the given
        filters, as CSV or JSON — operator.
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
        - name: action
          in: query
          required: false
          schema: { type: string }
          description: Exact match, e.g. `connector.create`
        - name: targetType
          in: query
          required: false
          schema: { type: string }
          description: Exact match, e.g. `connector`, `doc`
        - name: createdAfter
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only records with createdAt >= this RFC3339 timestamp
        - name: createdBefore
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: Only records with createdAt <= this RFC3339 timestamp
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="wiselabz-audit-<timestamp>.json|csv"'
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditRecord' }
            text/csv:
              schema: { type: string }
        '400':
          description: Invalid `format` (code `invalid_format`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/settings/retention:
    get:
      tags: [system]
      summary: >-
        Current data-retention cleanup configuration — operator. A default
        row (seeded from config on first boot) is always returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [system]
      summary: >-
        Update the data-retention cleanup configuration — operator. Each
        `*Days` field must be >= 0 (0 disables cleanup for that category,
        rejected otherwise with code `invalid_days`); `cronExpr` must be a
        valid 5-field or 6-field cron expression (code `invalid_cron`
        otherwise). Re-registers the retention cron job with the new
        schedule. Audited as `retention.settings.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionSettings' }
        '400':
          description: >-
            Invalid JSON body, `cronExpr` empty/invalid (code `invalid_cron`),
            or a negative `*Days` value (code `invalid_days`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/backup/export:
    get:
      tags: [system]
      summary: >-
        Export a portable backup bundle (connectors, docs+versions,
        templates+sections, an informational AI config summary) — operator.
        Connector secret fields and the AI API key are never included; see
        docs/BACKUP.md.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="wiselabz-backup-<timestamp>.zip"'
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/backup/import:
    post:
      tags: [system]
      summary: >-
        Import a backup bundle — operator. Validates referential integrity
        and format version before writing anything; existing records (by ID)
        are left untouched and counted as skipped. The AI config summary, if
        present, is never applied. Accepts v1 JSON and v2 ZIP; configurable limit defaults to 1 GiB.
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
          application/json:
            schema: { $ref: '#/components/schemas/BackupBundle' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupImportResult' }
        '400':
          description: Invalid JSON body, or the bundle failed validation (code `invalid_backup`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Backup upload exceeds the configured import limit (1 GiB default)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/backup/schedule:
    get:
      tags: [system]
      summary: >-
        Current scheduled-backup configuration — operator. A default schedule
        is seeded at startup, so this always returns a value.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [system]
      summary: >-
        Update the scheduled-backup configuration — operator. `cronExpr` must
        be a valid 5-field or 6-field cron expression; an invalid one is
        rejected (code `invalid_cron`) before it's persisted or handed to the
        scheduler. Re-registers the backup cron job with the new schedule.
        Audited as `backup.schedule.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupSchedule' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSchedule' }
        '400':
          description: Invalid JSON body, or `cronExpr` is empty/not a valid cron expression (code `invalid_cron`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/backup/runs:
    get:
      tags: [system]
      summary: Paginated history of backups created by the schedule or on demand — operator
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRunPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/backup/run:
    post:
      tags: [system]
      summary: >-
        Trigger a backup immediately (`triggeredBy: "manual"`) — operator.
        Writes the bundle to the configured backup directory, records the run,
        and applies the current retention policy (same pruning as scheduled
        backups). Audited as `backup.run.created`, and as `backup.run.pruned`
        if the retention policy removes any older runs.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/diagnostics:
    get:
      tags: [system]
      summary: >-
        Sanitized diagnostics bundle (health, versions, secret-free config,
        recent failures) — operator. See docs/DIAGNOSTICS.md.
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="wiselabz-diagnostics-<timestamp>.json"'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsBundle' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /system/jobs:
    get:
      tags: [system]
      summary: Scheduled background jobs and persisted health (operator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JobInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── scheduled reports (#280) ─────────────────────────
  /reports/definitions:
    get:
      tags: [reports]
      summary: List report definitions (operator)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReportDefinition' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reports]
      summary: >-
        Create a report definition (operator). Registers a cron job named
        `report:<slug>`. `slug` must be unique (code `slug_taken` otherwise);
        `cronExpr` is validated the same way as other scheduled jobs;
        `timezone` must be a valid IANA zone name (applied as a `CRON_TZ=`
        prefix on the cron expression). Audited as `report.definition.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportDefinitionInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/definitions/{reportDefinitionId}:
    parameters: [{ $ref: '#/components/parameters/ReportDefinitionId' }]
    put:
      tags: [reports]
      summary: >-
        Update a report definition (operator). Re-registers the cron job if
        `cronExpr`/`timezone`/`enabled` changed. `slug` is immutable; a
        different value is rejected with `400` (code `slug_immutable`).
        Audited as `report.definition.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportDefinitionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [reports]
      summary: >-
        Delete a report definition (operator). Unregisters its cron job and
        deletes its `job_health` row (`report:<slug>`); previously generated
        reports are kept with `definitionId` set to null. Audited as
        `report.definition.delete`.
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/definitions/{reportDefinitionId}/run:
    post:
      tags: [reports]
      summary: >-
        Generate a report immediately (operator). Uses the same window as
        the next scheduled run (previous scheduled report's `periodEnd` →
        now, or the last 7 days on a definition's first run; capped at 31
        days) but does NOT advance the definition's schedule watermark, so
        the next scheduled tick still covers the period this manual run
        also covered. Delivers to the definition's configured channels the
        same as a scheduled run. Audited as `report.definition.run`.
      parameters: [{ $ref: '#/components/parameters/ReportDefinitionId' }]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports:
    get:
      tags: [reports]
      summary: List generated reports, newest first
      parameters:
        - name: definitionId
          in: query
          required: false
          schema: { type: string }
          description: Filter to reports generated by one definition.
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
  /reports/{reportId}:
    parameters: [{ $ref: '#/components/parameters/ReportId' }]
    get:
      tags: [reports]
      summary: One generated report, including its typed data and rendered Markdown
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/NotFound' }
  /reports/{reportId}/download:
    get:
      tags: [reports]
      summary: Download a report as Markdown or self-contained HTML
      parameters:
        - { $ref: '#/components/parameters/ReportId' }
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [md, html] }
      responses:
        '200':
          description: OK
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="report-<slug>-<periodEnd date>.md|html"'
          content:
            text/markdown:
              schema: { type: string }
            text/html:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [system]
      summary: Health of backend + integrations
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Available at the server root; reports whether the HTTP server is running.
      servers: [{ url: / }]
      security: []
      responses:
        '200':
          description: Server is live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Liveness' }
  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: Available at the server root; returns 503 when the database is unavailable or migrations are pending.
      servers: [{ url: / }]
      security: []
      responses:
        '200':
          description: Server is ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Server is not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /connectors/{connectorId}/permissions:
    get:
      tags: [connectors]
      summary: List per-connector access grants (instance-admin only)
      description: >
        One row per (user, source) pair — a user with both a manual grant and
        an OIDC group->connector-role sync can appear twice, once per `source`
        (#279 part 3). `source: "oidc"` rows are read-only: they're revoked by
        the user's IdP group membership at their next login, not by this API.
        `source: "config"` rows are read-only too: they come from the
        connector's `grants` in config.yaml and are reconciled at startup.
      parameters: [{ $ref: '#/components/parameters/ConnectorId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    source: { type: string, enum: [manual, oidc, config], description: How the grant was created; see the endpoint description. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connectors/{connectorId}/permissions/{userId}:
    put:
      tags: [connectors]
      summary: Grant or change a user's manual role on a connector (instance-admin only)
      description: >
        Always acts on the `source: "manual"` grant; never touches an `oidc`
        row synced for the same user/connector pair (#279 part 3).
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [viewer, operator] }
      responses:
        '200':
          description: The resulting grant
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  source: { type: string, enum: [manual, oidc, config] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [connectors]
      summary: Revoke a user's manual grant on a connector (instance-admin only)
      description: >
        Always acts on the `source: "manual"` grant; an `oidc` row synced for
        the same pair, if any, is untouched and still governs access until the
        user's next login (#279 part 3).
      parameters:
        - { $ref: '#/components/parameters/ConnectorId' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /docs/share-links:
    get:
      tags: [docs]
      summary: List the caller's read-only doc share links
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
    post:
      tags: [docs]
      summary: Create a read-only share link for a doc or doc subtree
      description: The response carries the raw token once; only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docTreeRoot, expiresAt]
              properties:
                docTreeRoot: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /docs/share-links/{id}:
    delete:
      tags: [docs]
      summary: Revoke a share link (creator or instance admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /share/{token}/tree:
    get:
      tags: [docs]
      summary: Doc tree visible through a share link (unauthenticated)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Share link revoked or expired }
  /share/{token}/docs/{docId}:
    get:
      tags: [docs]
      summary: A doc visible through a share link (unauthenticated, read-only)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/DocId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Doc' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { description: Share link revoked or expired }

  /ws/ticket:
    post:
      tags: [system]
      summary: Mint a one-time WebSocket ticket for the authenticated caller
      description: Redeem it as `?ticket=` on GET /ws (see docs/WS_CONTRACT.md).
        Read-only and connector-restricted API keys may mint one; the socket then
        receives only the connector events the key's owner can read, narrowed to
        the key's connectors.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: In-memory access token (§8.7). Refresh token rides an HttpOnly cookie.

  parameters:
    UserId: { name: userId, in: path, required: true, schema: { type: string } }
    ConnectorId: { name: connectorId, in: path, required: true, schema: { type: string } }
    DocId: { name: docId, in: path, required: true, schema: { type: string } }
    Rev: { name: rev, in: path, required: true, schema: { type: integer } }
    TemplateId: { name: templateId, in: path, required: true, schema: { type: string } }
    ChangeId: { name: changeId, in: path, required: true, schema: { type: string } }
    AlertId: { name: alertId, in: path, required: true, schema: { type: string } }
    RunbookId: { name: runbookId, in: path, required: true, schema: { type: string } }
    RunbookStepId: { name: stepId, in: path, required: true, schema: { type: string } }
    ProposalId: { name: proposalId, in: path, required: true, schema: { type: string } }
    FindingId: { name: findingId, in: path, required: true, schema: { type: string } }
    ReportDefinitionId: { name: reportDefinitionId, in: path, required: true, schema: { type: string } }
    ReportId: { name: reportId, in: path, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    ChatConversationId: { name: id, in: path, required: true, schema: { type: string } }
    ServiceIdQuery: { name: serviceId, in: query, required: false, schema: { type: string } }
    DaysQuery: { name: days, in: query, required: false, schema: { type: integer, default: 7, minimum: 1 } }
    Page: { name: page, in: query, required: false, schema: { type: integer, default: 1, minimum: 1 } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: >-
        Opt in to keyset (cursor) pagination, which stays cheap as the table
        grows. Send it empty for the first page, then echo back the previous
        response's `nextCursor` (or `X-Next-Cursor` header, where the response
        body is a bare array). The value is opaque and must not be constructed
        by clients. Omit the parameter entirely for offset pagination, whose
        behaviour is unchanged; `page` is ignored while a cursor is in use.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Forbidden (insufficient role)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ElevationRequired:
      description: >
        Elevation required — step-up is enabled and the X-Elevation-Token was
        missing or expired. Client should call POST /auth/elevate and retry.
        Error.code = `elevation-required`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    TopologyPathStep:
      type: object
      required: [connectorId, connectorName, kind, name]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        kind: { type: string }
        name: { type: string }
        nodeId: { type: string, description: "Matching graph node ID, including the resolved identity when available." }
        edgeKind: { type: string }
        edgeSource: { type: string }
        detail: { type: string }
    TopologyGraph:
      type: object
      required: [nodes, edges, truncated]
      properties:
        truncated: { type: boolean, description: True when the 2000-node or 5000-edge cap omitted part of the graph. }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/TopologyNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/TopologyEdge' }
    TopologyNode:
      type: object
      required: [id, type, name]
      properties:
        id: { type: string }
        type: { type: string, enum: [identity, node] }
        name: { type: string }
        kind: { type: string }
        connectorId: { type: string }
        ref: { type: string }
    TopologyEdge:
      type: object
      required: [id, source, target, kind]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        kind: { type: string, enum: [dependency, same_as, contains, resolves_to, proxies_to, runs_on] }
        sourceLabel: { type: string }
        detail: { type: string }
    EntityDetail:
      type: object
      required: [id, kind, name, gone, members, relatedByIp, neighbors, history, findings, onReportingConnectors, runbooks]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        name: { type: string }
        gone: { type: boolean }
        members:
          type: array
          items: { $ref: '#/components/schemas/EntityMember' }
        relatedByIp:
          type: array
          items: { $ref: '#/components/schemas/EntityLink' }
        neighbors:
          type: array
          items: { $ref: '#/components/schemas/EntityNeighbor' }
        history:
          type: array
          items: { $ref: '#/components/schemas/EntityHistoryChange' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/EntityFinding' }
        onReportingConnectors:
          type: array
          items: { $ref: '#/components/schemas/EntityFinding' }
        runbooks:
          type: array
          items: { $ref: '#/components/schemas/EntityRunbook' }
    EntityMember:
      type: object
      required: [connectorId, connectorName, kind, ref, name]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        docId:
          type: string
          description: The connector's generated service doc, when one exists.
        kind: { type: string }
        ref: { type: string }
        name: { type: string }
        goneAt: { type: string, format: date-time }
    EntityLink:
      type: object
      required: [from, to, reason]
      properties:
        from: { $ref: '#/components/schemas/EntityEndpoint' }
        to: { $ref: '#/components/schemas/EntityEndpoint' }
        reason: { type: string }
    EntityNeighbor:
      type: object
      required: [kind, from, to]
      properties:
        kind: { type: string }
        from: { $ref: '#/components/schemas/EntityEndpoint' }
        to: { $ref: '#/components/schemas/EntityEndpoint' }
        detail: { type: string }
    EntityEndpoint:
      type: object
      required: [connectorId, kind, name, ref]
      properties:
        connectorId: { type: string }
        kind: { type: string }
        name: { type: string }
        ref: { type: string }
        entityId:
          type: string
          format: uuid
          description: Another entity the caller can open that this endpoint belongs to. Omitted for this entity and for endpoints without an active identity.
    EntityHistoryChange:
      allOf:
        - $ref: '#/components/schemas/EntityChange'
        - type: object
          required: [connectorId, at]
          properties:
            connectorId: { type: string }
            at: { type: string, format: date-time }
    EntityFinding:
      type: object
      required: [id, connectorId, checkType, severity, title, description, status, detectedCount, firstDetectedAt, lastSeenAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        entityKind: { type: string }
        entityRef: { type: string }
        ruleId: { type: string }
        checkType: { type: string }
        severity: { type: string }
        title: { type: string }
        description: { type: string }
        remediationLink: { type: string }
        status: { type: string }
        detectedCount: { type: integer }
        firstDetectedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    EntityRunbook:
      type: object
      required: [id, title, body, step]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        step:
          type: object
          required: [id, title, verb]
          properties:
            id: { type: string }
            title: { type: string }
            verb: { type: string }
    SearchResults:
      type: object
      required: [docs, runbooks, entities]
      properties:
        docs:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        runbooks:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityHit' }
    SearchHit:
      type: object
      required: [type, id, title, snippet, score]
      properties:
        type: { type: string, enum: [doc, runbook] }
        id: { type: string }
        title: { type: string }
        serviceId: { type: string }
        snippet: { type: string }
        score: { type: number }
    EntityHit:
      type: object
      required: [entityId, connectorId, connectorName, docId, kind, name, externalId, ip, hostname, mac, aliases]
      properties:
        entityId: { type: string }
        connectorId: { type: string }
        connectorName: { type: string }
        docId: { type: string }
        kind: { type: string }
        name: { type: string }
        externalId: { type: string }
        ip: { type: string }
        hostname: { type: string }
        mac: { type: string }
        aliases:
          type: array
          items: { type: string }
    # ── shared enums ──
    Role:
      type: string
      description: >
        Two roles (ARCHITECTURE.md 2026-06-27). `viewer` reads docs + live state;
        `operator` adds every mutating action (sync, connector CRUD, and — for the
        v1 single-admin homelab — user management). Enforced server-side on every
        mutating endpoint; UI hiding a control is convenience, never the boundary.
      enum: [viewer, operator]
    ServiceStatus:
      type: string
      enum: [online, degraded, offline, unknown]
    Severity:
      type: string
      enum: [info, warning, critical]
    AlertStatus:
      type: string
      enum: [pending, resolved, dismissed, snoozed]
    QualityCheckType:
      type: string
      enum: [stale, empty, failing, ownership_incomplete, credential_rotation, compliance, config_drift]
    QualityFindingStatus:
      type: string
      enum: [open, resolved]
    ConnectorCategory:
      type: string
      enum: [virtualization, containers_paas, networking, dns]
    SyncPhase:
      type: string
      enum: [queued, fetching, diffing, generating, done, error]

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          description: Field-level validation failures, when the error is field-specific.
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, msg]
      properties:
        field: { type: string, description: "Request field the failure applies to: a body field, a query parameter, or an indexed path such as [0].provider" }
        msg: { type: string, description: Human-readable reason the field was rejected }

    # ── auth ──
    AuthProviders:
      type: object
      required: [localEnabled, oidc]
      properties:
        localEnabled: { type: boolean }
        oidc:
          type: array
          items:
            type: object
            required: [id, displayName, authUrl]
            properties:
              id: { type: string }
              displayName: { type: string }
              authUrl: { type: string, description: Provider authorize URL to redirect to }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    OidcCallbackRequest:
      type: object
      required: [providerId, code, state]
      properties:
        providerId: { type: string }
        code: { type: string }
        state: { type: string }
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Access token TTL in seconds }
        user: { $ref: '#/components/schemas/User' }
        mfaEnrollmentRequired:
          type: boolean
          description: >-
            Set when the require_2fa policy covers this user but they haven't
            enrolled a factor yet. The session is confined to the enrollment
            allowlist (GET /me, /me/mfa/**, logout, refresh) until they do.
    LoginMfaRequired:
      type: object
      description: Returned by POST /auth/login instead of a session when the user has a confirmed factor.
      required: [mfaRequired, ticket, methods]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        ticket: { type: string, description: Short-lived (5 min) ticket for POST /auth/login/mfa }
        methods:
          type: array
          items: { type: string, enum: [totp, recovery, webauthn] }
    LoginMfaRequest:
      type: object
      description: One of `totp` or `recoveryCode` finishes the login POST /auth/login started.
      required: [ticket]
      properties:
        ticket: { type: string }
        totp: { type: string, description: 6-digit TOTP code }
        recoveryCode: { type: string, description: 'A single-use recovery code, e.g. "abcde-fghjk"' }
        webauthn: { $ref: '#/components/schemas/WebAuthnResponse' }
    WebAuthnOptions:
      type: object
      description: JSON envelope produced by go-webauthn for the browser WebAuthn API.
      additionalProperties: true
    WebAuthnResponse:
      type: object
      description: Browser credential response encoded as WebAuthn JSON.
      additionalProperties: true
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration; omitted or empty means never.
        scope: { $ref: '#/components/schemas/ApiKeyScope' }
        connectorIds:
          type: array
          maxItems: 100
          items: { type: string, format: uuid }
          description: >-
            Optional allow-list of connectors the key can reach. Each must be a
            connector the caller holds a grant on. A connector-restricted key
            never acts as instance admin. Omitted or empty means no restriction.
    ApiKeyScope:
      type: string
      enum: [full, read]
      default: full
      description: >-
        full acts with the owner's access. read allows only GET/HEAD/OPTIONS
        requests and caps the key's role on every connector at viewer.
    ApiKey:
      type: object
      required: [id, name, role, createdAt, expiresAt, lastUsedAt, revokedAt, scope, connectorIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        scope: { $ref: '#/components/schemas/ApiKeyScope' }
        connectorIds:
          type: array
          items: { type: string, format: uuid }
          description: Connectors the key is restricted to; empty means unrestricted.
    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [token]
          properties:
            token: { type: string, description: Opaque token shown only once }

    # ── users ──
    User:
      type: object
      required: [id, username, role, authSource, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        authSource: { type: string, enum: [local, oidc] }
        disabled: { type: boolean }
        canManageDashboardDefaults: { type: boolean, description: 'When role is operator, grants permission to edit the admin-default dashboard layout' }
        createdAt: { type: string, format: date-time }
        digestCadence: { type: string, enum: [off, daily, weekly] }
        digestTimezone: { type: string, description: 'IANA timezone, e.g. America/New_York' }
        mfaEnabled:
          type: boolean
          description: 'Has a confirmed MFA factor (#279). Only populated by GET /users; omitted elsewhere.'
    UserCreate:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        password: { type: string, format: password, description: Local accounts only }
        canManageDashboardDefaults: { type: boolean, description: 'Only valid when role is operator; grants permission to edit the admin-default dashboard layout' }
    UserUpdate:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        disabled: { type: boolean }
        displayName: { type: string }
        canManageDashboardDefaults: { type: boolean, description: 'Only valid when role is operator; grants permission to edit the admin-default dashboard layout' }
    ProfileUpdate:
      type: object
      properties:
        displayName: { type: string }
        email: { type: string, format: email }
        digestCadence: { type: string, enum: [off, daily, weekly] }
        digestTimezone: { type: string, description: 'IANA timezone, e.g. America/New_York' }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    Session:
      type: object
      required: [id, createdAt, lastSeenAt, current]
      properties:
        id: { type: string }
        userAgent: { type: string }
        ip: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        current: { type: boolean }

    # ── me / mfa (#279) ──
    MfaFactor:
      type: object
      required: [id, type, name, createdAt]
      properties:
        id: { type: string }
        type: { type: string, enum: [totp, webauthn] }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    MfaStatus:
      type: object
      required: [factors, recoveryCodesRemaining, required, webauthnAvailable]
      properties:
        factors:
          type: array
          items: { $ref: '#/components/schemas/MfaFactor' }
        recoveryCodesRemaining: { type: integer }
        webauthnAvailable: { type: boolean, description: Whether this instance has a usable WebAuthn relying party }
        required:
          type: boolean
          description: Whether the require_2fa policy currently covers this user.
    TotpEnrollment:
      type: object
      required: [factorId, secret, otpauthUrl]
      properties:
        factorId: { type: string }
        secret: { type: string, description: Manual-entry fallback for the QR code }
        otpauthUrl: { type: string, description: 'otpauth:// URL to render as a QR code' }
    TotpConfirmResult:
      type: object
      required: [factor]
      properties:
        factor: { $ref: '#/components/schemas/MfaFactor' }
        recoveryCodes:
          type: array
          items: { type: string }
          description: Present only on the user's first confirmed factor; shown once.
        accessToken:
          type: string
          description: Present only when the caller's prior session was enrollment-only.
        expiresIn: { type: integer, description: Access token TTL in seconds }

    # ── dashboard ──
    DashboardOverview:
      type: object
      required: [statusCounts, pendingAlerts, recentChanges, lastSyncAt]
      properties:
        statusCounts:
          type: object
          properties:
            online: { type: integer }
            degraded: { type: integer }
            offline: { type: integer }
            unknown: { type: integer }
        pendingAlerts: { type: integer }
        recentChanges:
          type: array
          items: { $ref: '#/components/schemas/ChangeSummary' }
        lastSyncAt: { type: string, format: date-time, nullable: true }
    DashboardLayout:
      type: object
      required: [widgets]
      properties:
        widgets:
          type: array
          items: { $ref: '#/components/schemas/WidgetPlacement' }
    WidgetPlacement:
      type: object
      required: [id, type, x, y, w, h]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [service_status, recent_changes, alert_summary, sync_activity, docs_health, attention, uptime]
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }

    # ── connectors ──
    Connector:
      type: object
      required: [id, name, category, type, enabled, status]
      properties:
        id: { type: string }
        name: { type: string, description: matches ServiceSnapshot.ServiceName }
        owner: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/ConnectorCategory' }
        type: { type: string, description: 'e.g. proxmox, portainer, pfsense' }
        enabled: { type: boolean }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        url: { type: string }
        verifyTls: { type: boolean }
        lastSyncAt:
          type: string
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          description: >-
            RFC 3339 timestamp of the last completed sync, or the empty string
            when the connector has never synced.
        statusMessage: { type: string }
        scheduleSeconds:
          { type: integer, nullable: true, description: 'Auto-sync cadence in seconds; null disables scheduled sync (manual only)' }
        nextRunAt:
          type: string
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          description: >-
            RFC 3339 timestamp of the next scheduled sync, or the empty string
            when no sync is scheduled (manual-only connectors).
        lastSyncDurationMs: { type: integer, nullable: true }
        lastSyncError: { type: string }
        retryCount:
          { type: integer, description: Consecutive sync failures since the last success; resets to 0 on success }
        credentialExpiresAt:
          type: string
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          description: >-
            RFC 3339 timestamp when the stored credentials expire, or the empty
            string when they have no known expiry.
        secretRotatedAt:
          { type: string, format: date-time, description: 'Read-only. When a secret-typed config field was last actually changed; set on create too' }
        userExpiresAt:
          type: string
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}T'
          description: >-
            Optional operator-set expiry the credential_rotation check treats as
            an upper bound on the due date: an RFC 3339 timestamp, or the empty
            string when unset.
        rotationMaxAgeDays:
          { type: integer, nullable: true, description: 'Overrides the global rotation.max_age_days for this connector; null uses the global default' }
        managedBy:
          type: string
          enum: [ui, config, config-orphaned]
          readOnly: true
          description: >-
            Who owns the connector's settings. `config`: declared in config.yaml
            and reconciled at startup, so edits, enable/disable and delete are
            rejected with 409. `config-orphaned`: its config entry was removed;
            it is disabled and can only be deleted or released.
    ConnectorCreate:
      type: object
      required: [name, category, type, url, config]
      properties:
        name: { type: string }
        owner: { type: string, nullable: true }
        category: { $ref: '#/components/schemas/ConnectorCategory' }
        type: { type: string }
        url: { type: string }
        verifyTls: { type: boolean, default: true }
        config:
          type: object
          additionalProperties: true
          description: Schema-driven fields incl. secrets; stored encrypted, never in plaintext config (ARCHITECTURE.md)
        userExpiresAt:
          { type: string, format: date-time, nullable: true, description: 'Optional operator-set credential expiry (RFC3339)' }
        rotationMaxAgeDays:
          { type: integer, nullable: true, minimum: 1, description: 'Overrides the global rotation.max_age_days for this connector' }
    ConnectorUpdate:
      type: object
      properties:
        name: { type: string }
        owner: { type: string, nullable: true }
        url: { type: string }
        verifyTls: { type: boolean }
        config:
          type: object
          additionalProperties: true
        scheduleSeconds:
          { type: integer, nullable: true, description: 'Auto-sync cadence in seconds; null disables scheduled sync (manual only)' }
        userExpiresAt:
          { type: string, format: date-time, nullable: true, description: 'Optional operator-set credential expiry (RFC3339); null clears it' }
        rotationMaxAgeDays:
          { type: integer, nullable: true, minimum: 1, description: 'Overrides the global rotation.max_age_days for this connector; null clears the override' }
    MaintenanceWindow:
      type: object
      required: [id, connectorId, startsAt, endsAt, createdBy, createdAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        createdBy: { type: string, description: 'Operator user ID that opened the window' }
        createdAt: { type: string, format: date-time }
    OpenMaintenanceWindowRequest:
      type: object
      required: [durationMinutes]
      properties:
        durationMinutes: { type: integer, minimum: 1, description: 'e.g. 30, 60, 120, or a custom value' }
    GoldenSnapshot:
      type: object
      required: [connectorId, snapshotId, pinnedBy, pinnedAt]
      properties:
        connectorId: { type: string }
        snapshotId: { type: string }
        pinnedBy: { type: string, description: 'User ID that pinned this snapshot' }
        pinnedAt: { type: string, format: date-time }
    PinGoldenSnapshotRequest:
      type: object
      properties:
        snapshotId: { type: string, description: 'Snapshot to pin as golden; omit to pin the connector''s current latest snapshot' }
    ConnectorTypeSchema:
      type: object
      required: [category, type, displayName, fields, capabilities]
      properties:
        category: { $ref: '#/components/schemas/ConnectorCategory' }
        type: { type: string }
        displayName: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/SchemaField' }
        stub:
          type: boolean
          default: false
          description: >-
            True for connector types with no real implementation yet (Fetch/Validate always
            fail). The UI should mark the type as coming soon and hide/disable
            Test connection, Sync, and data-viewing actions for it.
        degradedLatencyThresholdMs:
          type: integer
          description: >-
            Health-check latency (ms) above which this connector type reports
            "degraded" instead of "online". Omitted/zero means use the server's
            global default.
        isCredentialRefresher:
          type: boolean
          default: false
          description: >-
            True if this type's credentials refresh automatically (e.g. OAuth2).
            The credential_rotation quality check always skips it, and the UI
            should hide the rotation reminder fields on its connector form.
        lifecycleVerbs:
          type: array
          items: { type: string, enum: [restart, start, stop] }
          description: >-
            The lifecycle verbs (restart/start/stop) this type's connector
            implementation supports, e.g. for filtering the runbook step
            editor's verb picker to what a chosen connector can actually do.
        capabilities:
          $ref: '#/components/schemas/ConnectorCapabilities'
    ConnectorCapabilities:
      type: object
      required: [restart, start, stop, configPush, credentialRefresh]
      properties:
        restart: { type: boolean }
        start: { type: boolean }
        stop: { type: boolean }
        configPush: { type: boolean }
        credentialRefresh: { type: boolean }
    SchemaField:
      type: object
      required: [name, label, kind, required]
      properties:
        name: { type: string }
        label: { type: string }
        kind: { type: string, enum: [string, number, boolean, password, select, secret] }
        required: { type: boolean }
        secret: { type: boolean, description: Rendered as password input; write-only }
        placeholder: { type: string }
        description: { type: string }
        pattern: { type: string, description: Regexp a text/password value must match }
        minLength: { type: integer }
        maxLength: { type: integer }
        options:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
    ComplianceAttributeSpec:
      type: object
      required: [name, type, description]
      properties:
        name: { type: string, description: 'Attribute name (e.g., enabled, ipAddress)' }
        type: { type: string, enum: [string, number, boolean, string_array], description: 'Attribute value type' }
        description: { type: string, description: 'Human-readable description of the attribute' }
    ComplianceSchema:
      type: object
      required: [attributes, joinFields]
      properties:
        attributes:
          type: object
          description: 'Attribute specs by connector type, then entity kind'
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items: { $ref: '#/components/schemas/ComplianceAttributeSpec' }
        joinFields:
          type: array
          description: 'Typed entity fields a related clause can join on; a catalog attribute is joined as "attributes.<name>"'
          items: { type: string }
    ComplianceCondition:
      type: object
      required: [attribute, op, value]
      properties:
        attribute: { type: string }
        op: { type: string, enum: [eq, neq, contains, not_contains, regex, exists, gt, lt] }
        value: {}
    ComplianceJoin:
      type: object
      required: [sourceField, relatedField]
      properties:
        sourceField: { type: string, description: 'Typed field of the source entity, or "attributes.<name>"' }
        relatedField: { type: string, description: 'Typed field of the related entity, or "attributes.<name>"' }
    ComplianceRelatedClause:
      type: object
      required: [mode, connectorType, entityKind, join]
      properties:
        mode: { type: string, enum: [requires, forbids] }
        connectorType: { type: string }
        entityKind: { type: string }
        join: { $ref: '#/components/schemas/ComplianceJoin' }
        conditions: { type: array, items: { $ref: '#/components/schemas/ComplianceCondition' } }
    ComplianceRuleInput:
      type: object
      required: [name, connectorType, entityKind, conditions, severity, title]
      properties:
        name: { type: string }
        connectorType: { type: string }
        entityKind: { type: string }
        conditions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ComplianceCondition' } }
        related:
          type: array
          maxItems: 5
          description: 'Clauses ANDed against entities of other connectors. A source entity violates when a requires clause finds no related entity or a forbids clause finds one.'
          items: { $ref: '#/components/schemas/ComplianceRelatedClause' }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        remediationLink: { type: string }
        enabled: { type: boolean, default: false }
    ComplianceRule:
      allOf:
        - { $ref: '#/components/schemas/ComplianceRuleInput' }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    ComplianceRulePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceRule' } }
    ComplianceRulePackInstallResult:
      type: object
      required: [installed, skipped]
      properties:
        installed: { type: integer, description: Rules created from the pack. }
        skipped: { type: integer, description: Pack rules left alone because a rule with the same name exists. }
    ComplianceRuleTestMatch:
      type: object
      required: [connectorId, connectorName, entities]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        entities: { type: array, items: { type: object, additionalProperties: true } }
    ComplianceRuleTestResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ComplianceRuleTestMatch' } }
    TestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }
        latencyMs: { type: integer }
    HealthCheckResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ServiceStatus' }
        message: { type: string }
        latencyMs: { type: integer }
    UptimeWindowStats:
      type: object
      required: [windowStart, windowEnd, checkCount, availabilityPct, mttrSeconds, outageCount]
      properties:
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        checkCount: { type: integer, description: 'Number of health checks that contributed measured (non-maintenance) time in this window; 0 means no data and availabilityPct is meaningless' }
        availabilityPct:
          {
            type: number,
            format: double,
            description: Time-weighted % of measured time spent in a non-offline status (a status is only extrapolated a bounded time past its check); 0 when checkCount is 0,
          }
        mttrSeconds:
          {
            type: number,
            format: double,
            description: 'Mean time to recovery, in seconds, over outages that both started and recovered inside the window; 0 when there were none.',
          }
        outageCount: { type: integer, description: Number of resolved outages the mttrSeconds mean is over }
    UptimeReport:
      type: object
      required: [connectorId, windows]
      properties:
        connectorId: { type: string }
        windows:
          type: object
          description: Keyed by window label ("24h", "7d", "30d")
          additionalProperties: { $ref: '#/components/schemas/UptimeWindowStats' }
    UptimeHistoryBucket:
      type: object
      required: [start, status, checkCount]
      properties:
        start: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        avgLatencyMs: { type: integer, format: int64, description: Mean latency of checks in the bucket that reported one }
        checkCount: { type: integer }
    UptimeHistory:
      type: object
      required: [connectorId, window, windowStart, windowEnd, bucketSeconds, buckets]
      properties:
        connectorId: { type: string }
        window: { type: string, enum: ['24h', '7d', '30d'] }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        bucketSeconds: { type: integer, description: Width of each bucket; buckets are placed by start time so gaps (no checks) are visible }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/UptimeHistoryBucket' }
    FleetUptimeEntry:
      type: object
      required: [connectorId, name, checkCount, availabilityPct, mttrSeconds, outageCount]
      properties:
        connectorId: { type: string }
        name: { type: string }
        checkCount: { type: integer, description: 'Checks that contributed measured (non-maintenance) time; zero means no data for the window' }
        availabilityPct: { type: number, format: double }
        mttrSeconds: { type: number, format: double }
        outageCount: { type: integer }
    FleetUptime:
      type: object
      required: [window, connectors]
      properties:
        window: { type: string, enum: ['24h', '7d', '30d'] }
        connectors:
          type: array
          items: { $ref: '#/components/schemas/FleetUptimeEntry' }
    SyncJobRef:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string }
        serviceId: { type: string, nullable: true }
    SyncRun:
      type: object
      description: One historical sync attempt for a connector (manual or scheduled)
      required: [id, connectorId, startedAt, status, attempt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        status: { type: string, enum: [success, error, skipped] }
        error: { type: string }
        attempt:
          { type: integer, description: Retry attempt number for this run; 1 for the first try }
        changesCount: { type: integer }
        alertsCount: { type: integer }
        snapshotId: { type: string, nullable: true, description: 'Snapshot produced by this run, if one was saved' }
    ServiceSnapshot:
      type: object
      description: Mirrors backend connector.ServiceSnapshot
      required: [serviceName, type, sections, fetchedAt]
      properties:
        serviceName: { type: string }
        type: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SnapshotSection' }
        metadata:
          type: object
          additionalProperties: { type: string }
        fetchedAt: { type: string, format: date-time }
    SnapshotSection:
      type: object
      required: [title, content, order]
      properties:
        title: { type: string }
        content: { type: string, description: Markdown }
        order: { type: integer }
    SnapshotSummary:
      type: object
      required: [id, fetchedAt, sizeBytes, golden]
      properties:
        id: { type: string }
        fetchedAt: { type: string, format: date-time }
        sizeBytes: { type: integer, format: int64 }
        golden: { type: boolean }
    SnapshotFull:
      type: object
      required: [id, connectorId, serviceName, type, sections, entities, dependencies, metadata, fetchedAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        serviceName: { type: string }
        type: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SnapshotContentSection' }
        entities:
          type: array
          items: { $ref: '#/components/schemas/SnapshotEntity' }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/SnapshotDependency' }
        metadata:
          type: object
          additionalProperties: { type: string }
        fetchedAt: { type: string, format: date-time }
    SnapshotContentSection:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string, description: Markdown }
    SnapshotEntity:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        name: { type: string }
        ip: { type: string }
        hostname: { type: string }
        externalId: { type: string }
        attributes:
          type: object
          additionalProperties: true
    SnapshotDependency:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string }
        name: { type: string }
        ref: { type: string }
    SnapshotDiff:
      type: object
      required: [provenance, summary, sections, entities, dependencies]
      properties:
        provenance: { $ref: '#/components/schemas/SnapshotDiffProvenance' }
        summary: { $ref: '#/components/schemas/SnapshotDiffSummary' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/SnapshotSectionChange' }
        entities:
          type: array
          items: { $ref: '#/components/schemas/EntityChange' }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/DependencyChange' }
    SnapshotDiffProvenance:
      type: object
      required: [connectorId, connectorName, from, to, generatedAt, generatedBy]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        from: { $ref: '#/components/schemas/SnapshotDiffSource' }
        to: { $ref: '#/components/schemas/SnapshotDiffSource' }
        generatedAt: { type: string, format: date-time }
        generatedBy: { type: string }
    SnapshotDiffSource:
      type: object
      required: [id, fetchedAt, sha256]
      properties:
        id: { type: string }
        fetchedAt: { type: string, format: date-time }
        sha256: { type: string }
    SnapshotDiffSummary:
      type: object
      required: [sectionsAdded, sectionsRemoved, sectionsModified, entitiesAdded, entitiesRemoved, entitiesModified, dependenciesAdded, dependenciesRemoved]
      properties:
        sectionsAdded: { type: integer }
        sectionsRemoved: { type: integer }
        sectionsModified: { type: integer }
        entitiesAdded: { type: integer }
        entitiesRemoved: { type: integer }
        entitiesModified: { type: integer }
        dependenciesAdded: { type: integer }
        dependenciesRemoved: { type: integer }
    SnapshotSectionChange:
      type: object
      required: [type, severity, summary, detail, patches]
      properties:
        type: { type: string, enum: [added, removed, modified] }
        severity: { type: string }
        summary: { type: string }
        detail: { type: string }
        patches:
          type: array
          items: { $ref: '#/components/schemas/SnapshotDiffPatch' }
        relatedServiceIds:
          type: array
          items: { type: string }
    SnapshotDiffPatch:
      type: object
      required: [section]
      properties:
        section: { type: string }
        old: { type: string }
        new: { type: string }
        line: { type: integer }
    EntityChange:
      type: object
      required: [kind, key, name, field, change]
      properties:
        kind: { type: string }
        key: { type: string }
        name: { type: string }
        field: { type: string }
        change: { type: string, enum: [added, removed, modified] }
        old: { nullable: true }
        new: { nullable: true }
    DependencyChange:
      type: object
      required: [kind, name, ref, change]
      properties:
        kind: { type: string }
        name: { type: string }
        ref: { type: string }
        change: { type: string, enum: [added, removed] }

    # ── docs ──
    DocCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        serviceId: { type: string, description: Empty or omitted for lab scope }
        parentId: { type: string, description: Same-scope active parent; omitted for root }
        content: { type: string }
    DocPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        parentId: { type: string, description: Empty string moves to scope root }
    DocNode:
      type: object
      description: Tree node (recursive)
      required: [docId, title, kind]
      properties:
        docId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [lab, service] }
        serviceId: { type: string, nullable: true }
        parentId: { type: string }
        origin: { type: string, enum: [generated, human] }
        branch: { type: boolean, description: True for virtual scope groups }
        children:
          type: array
          items: { $ref: '#/components/schemas/DocNode' }
    DocImportIssue:
      type: object
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }
    DocImportNode:
      type: object
      required: [docId, title, path, serviceId, folder, attachmentCount, children]
      properties:
        docId: { type: string }
        title: { type: string }
        path: { type: string, description: Archive path of the note or folder }
        serviceId: { type: string, description: Empty for lab docs }
        folder: { type: boolean }
        attachmentCount: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/DocImportNode' }
    DocImportPreview:
      type: object
      required: [id, expiresAt, tree, docCount, attachmentCount, mappings, warnings, skipped, collisions]
      properties:
        id: { type: string }
        expiresAt: { type: string, format: date-time }
        tree:
          type: array
          items: { $ref: '#/components/schemas/DocImportNode' }
        docCount: { type: integer }
        attachmentCount: { type: integer }
        mappings:
          type: array
          items:
            type: object
            required: [source, link, target]
            properties:
              source: { type: string }
              link: { type: string, description: The link as written in the note }
              target: { type: string, description: '/docs/<id> or attachment:<id>' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/DocImportIssue' }
        skipped:
          type: array
          items: { $ref: '#/components/schemas/DocImportIssue' }
        collisions:
          type: array
          items:
            type: object
            required: [path, title, newTitle]
            properties:
              path: { type: string }
              title: { type: string }
              newTitle: { type: string }
    DocImportCreated:
      type: object
      required: [docId, title, parentId, serviceId]
      properties:
        docId: { type: string }
        title: { type: string }
        parentId: { type: string }
        serviceId: { type: string }
    DocAttachment:
      type: object
      required: [id, docId, sha256, filename, contentType, size, createdBy, createdAt]
      properties:
        id: { type: string }
        docId: { type: string }
        sha256: { type: string }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, format: int64 }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        url: { type: string, description: Signed URL expiring after fifteen minutes }
    Doc:
      type: object
      required: [docId, title, kind, content, currentVersion, updatedAt]
      properties:
        docId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [lab, service] }
        serviceId: { type: string, nullable: true }
        parentId: { type: string }
        deletedAt: { type: string, description: Empty for active docs; UTC deletion batch timestamp otherwise }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        content:
          type: string
          description: >
            Markdown body. Sync-owned sections are wrapped in
            `<!-- wl:gen key="…" h="…" -->` … `<!-- /wl:gen -->` comment
            markers; everything outside them is human-owned.
        currentVersion: { type: integer }
        updatedAt: { type: string, format: date-time }
        origin:
          type: string
          enum: [generated, human]
          description: generated docs have their marked sections refreshed by sync; human docs are never touched by sync
        templateId: { type: string, description: Template the doc is rendered through on sync; empty for the plain snapshot render }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/DocAttachment' }
        lastSyncedAt: { type: string, description: 'RFC3339 time sync last merged this doc; empty if never' }
    ResolveDocChange:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, keep] }
    DocLock:
      type: object
      description: Advisory editing lock on a doc. Empty object means unlocked/expired.
      properties:
        docId: { type: string }
        userId: { type: string }
        userName: { type: string, description: "Holder display name (username fallback)" }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    DocSave:
      type: object
      required: [content]
      properties:
        content: { type: string }
        baseVersion:
          type: integer
          description: 'Version the edit was based on; enables last-write-wins detection'
        trigger:
          type: string
          description: 'Provenance of this save, e.g. "manual", "ai:claude-sonnet-5", "template". Defaults to "manual" server-side if omitted.'
    TemplateSchema:
      type: object
      description: >
        Free-form reference for the template editor: available templateData field
        paths/types and the list of filter functions usable in `{{ .Field | fn }}`
        pipelines. Shape mirrors backend doc.templatefuncs and connector.ServiceSnapshot
        — not strictly typed since it's editor-reference-only.
      properties:
        fields:
          type: object
          additionalProperties: true
        functions:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              description: { type: string }
    DocVersionMeta:
      type: object
      required: [rev, createdAt, trigger]
      properties:
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        author: { type: string, nullable: true }
        trigger: { type: string, enum: [ai, template, manual, sync, import] }
    DocVersion:
      allOf:
        - $ref: '#/components/schemas/DocVersionMeta'
        - type: object
          required: [content]
          properties:
            content: { type: string }
    AiSuggestRequest:
      type: object
      properties:
        prompt: { type: string }
        selection: { type: string, description: Optional selected text to operate on }
    AiSuggestRef:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string }
    DocPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Doc' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    DocEditProposal:
      type: object
      required: [id, docId, docTitle, baseVersion, summary, authorId, status, createdAt]
      properties:
        id: { type: string }
        docId: { type: string }
        docTitle: { type: string }
        serviceId: { type: string, description: Empty for lab-wide docs }
        baseVersion: { type: integer, description: Doc version the proposal was written against }
        content: { type: string, description: Proposed replacement body. Omitted from list responses; fetch the single proposal to read it }
        summary: { type: string }
        authorId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewerId: { type: string }
        reviewedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    DocEditProposalPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DocEditProposal' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    RunbookDraft:
      type: object
      required: [title, body, targetType, targetValue]
      properties:
        title: { type: string }
        body: { type: string, description: Markdown template built from the alert and linked change }
        targetType: { type: string, enum: [change_type, alert_severity] }
        targetValue: { type: string }
        existingRunbookId: { type: string, description: Set when a runbook is already bound to the suggested target }
    GenerateResult:
      type: object
      required: [docId, title, content]
      properties:
        docId: { type: string }
        title: { type: string }
        content: { type: string }

    # ── chat ──
    ChatConversation:
      type: object
      required: [id, userId, scopeType, scopeId, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        scopeType: { type: string, enum: [doc, lab] }
        scopeId: { type: string, description: Doc ID when scopeType is "doc"; empty for "lab" }
        createdAt: { type: string, format: date-time }
    ChatConversationCreate:
      type: object
      required: [scopeType]
      properties:
        scopeType: { type: string, enum: [doc, lab] }
        scopeId: { type: string, description: Required when scopeType is "doc" }
    ChatConversationDetail:
      type: object
      required: [conversation, messages]
      properties:
        conversation: { $ref: '#/components/schemas/ChatConversation' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    ChatMessage:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        provider: { type: string, description: AI provider that produced an assistant reply }
        fallbackUsed:
          type: boolean
          description: >
            True if the primary provider failed and a fallback answered instead.
            Not persisted — present only on the response to the message that
            triggered generation, absent when re-fetching history.
        createdAt: { type: string, format: date-time }
    ChatMessageCreate:
      type: object
      required: [content]
      properties:
        content: { type: string }

    # ── templates ──
    Template:
      type: object
      required: [id, name, currentVersion, sections]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        currentVersion: { type: integer }
        appliesTo:
          type: object
          properties:
            category: { $ref: '#/components/schemas/ConnectorCategory' }
            type: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/TemplateSection' }
    TemplateInput:
      type: object
      required: [name, sections]
      properties:
        name: { type: string }
        description: { type: string }
        appliesTo:
          type: object
          properties:
            category: { $ref: '#/components/schemas/ConnectorCategory' }
            type: { type: string }
        sections:
          type: array
          items: { $ref: '#/components/schemas/TemplateSection' }
    TemplateSection:
      type: object
      required: [title, order, body]
      properties:
        title: { type: string }
        order: { type: integer }
        body: { type: string, description: Template body with placeholders }
    TemplateVersionMeta:
      type: object
      required: [rev, createdAt, trigger]
      properties:
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        author: { type: string, nullable: true }
        trigger: { type: string, enum: [save, restore] }
    TemplateVersion:
      allOf:
        - $ref: '#/components/schemas/TemplateVersionMeta'
        - type: object
          required: [name, sections]
          properties:
            name: { type: string }
            description: { type: string }
            appliesTo:
              type: object
              properties:
                category: { $ref: '#/components/schemas/ConnectorCategory' }
                type: { type: string }
            sections:
              type: array
              items: { $ref: '#/components/schemas/TemplateSection' }
    TemplateAffectedConnector:
      type: object
      required: [connectorId, connectorName, hasExistingDoc, wouldChange]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        hasExistingDoc: { type: boolean }
        wouldChange: { type: boolean }
        renderError: { type: string, nullable: true }
    TemplatePreviewResult:
      type: object
      required: [affected]
      properties:
        affected:
          type: array
          items: { $ref: '#/components/schemas/TemplateAffectedConnector' }
        detail:
          allOf:
            - $ref: '#/components/schemas/GenerateResult'
          nullable: true

    # ── changes ──
    ChangeSummary:
      type: object
      required: [id, serviceId, changeType, severity, summary, detectedAt]
      properties:
        id: { type: string }
        serviceId: { type: string }
        serviceName: { type: string }
        changeType: { type: string, description: 'e.g. vm.created, firewall.rule.modified; doc_conflict / doc_adopt for doc ownership reviews' }
        severity: { $ref: '#/components/schemas/Severity' }
        summary: { type: string }
        willTriggerAi: { type: boolean }
        detectedAt: { type: string, format: date-time }
    ChangeDetail:
      allOf:
        - $ref: '#/components/schemas/ChangeSummary'
        - type: object
          required: [diff, status]
          properties:
            status: { type: string, enum: [new, acknowledged, dismissed] }
            diff: { $ref: '#/components/schemas/Diff' }
            affectedDocIds:
              type: array
              items: { type: string }
            provenance:
              type: array
              description: >
                Document-diff provenance. Each entry identifies the changed snapshot
                field, the template section that rendered it, and the resulting lines
                in the head revision. Present only when a document diff has source data.
              items: { $ref: '#/components/schemas/DocumentDiffProvenance' }
            narration:
              type: string
              description: >
                Cached plain-English explanation of why this change matters, generated
                on demand via POST /changes/{changeId}/explain. Empty until requested.
            provider:
              type: string
              description: >
                AI provider that generated the narration on THIS call. Not persisted —
                present only on the response that just generated the narration, absent
                when the cached narration is served on a later call.
            fallbackUsed:
              type: boolean
              description: True if the primary provider failed over to a fallback on this call.
    DocumentDiffProvenance:
      type: object
      required: [snapshotPath, templateSection, diffLines]
      properties:
        snapshotPath:
          type: string
          description: JSON-style path of the snapshot field that changed.
        templateSection:
          type: string
          description: Title of the template section that rendered the field.
        diffLines:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }
          description: Changed line numbers in Diff.headText.
    JournalEntryInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 50000 }
        occurredAt:
          type: string
          format: date-time
          description: Defaults to now; supports backdated entries
        connectorId: { type: string, maxLength: 128 }
        docId: { type: string, maxLength: 128 }
        entityKind: { type: string, maxLength: 100 }
        entityName: { type: string, maxLength: 500 }
        entityRef: { type: string, maxLength: 2048 }
    JournalEntry:
      allOf:
        - { $ref: '#/components/schemas/JournalEntryInput' }
        - type: object
          required: [id, occurredAt, createdAt, updatedAt, createdBy]
          properties:
            id: { type: string }
            occurredAt: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            createdBy: { type: string }
    TimelineItem:
      type: object
      required: [id, kind, timestamp, title, body, connectorId, docId, createdBy, entityKind, entityName, entityRef, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [change, sync, alert, doc, journal, audit] }
        timestamp: { type: string, format: date-time }
        title: { type: string }
        body: { type: string }
        connectorId: { type: string }
        docId: { type: string }
        createdBy: { type: string }
        entityKind: { type: string }
        entityName: { type: string }
        entityRef: { type: string }
        status: { type: string }
    TimelinePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        nextCursor:
          type: string
          description: Opaque next page cursor, omitted on the last page
    ChangePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChangeSummary' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        nextCursor:
          type: string
          description: >-
            Cursor for the next keyset page. Present only when the request sent
            `cursor` and more rows follow; absent for offset requests and on the
            last page.
    BulkResolveRequest:
      type: object
      required: [ids, status]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
          description: Explicit change IDs to resolve — never "all matching the current filter".
        status:
          type: string
          enum: [acknowledged, dismissed]
    BulkResolveItemResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [success, error] }
        reason:
          type: string
          description: 'Present when status is error, e.g. not_found, not_low_risk, internal_error.'
    BulkResolveResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BulkResolveItemResult' }
    AlertBulkSnoozeRequest:
      type: object
      required: [ids, until]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
          description: Explicit alert IDs to snooze — never "all matching the current filter".
        until: { type: string, format: date-time }
    AlertBulkSnoozeItemResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [success, error] }
        reason:
          type: string
          description: 'Present when status is error, e.g. not_found, internal_error.'
    AlertBulkSnoozeResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/AlertBulkSnoozeItemResult' }
    ConnectorBulkSyncRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
          description: Explicit connector IDs to sync — never "all matching the current filter".
    ConnectorBulkSyncItemResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [success, error] }
        jobId:
          type: string
          description: Present when status is success — the async sync job's ID (see SyncJobRef).
        reason:
          type: string
          description: 'Present when status is error, e.g. not_found.'
    ConnectorBulkSyncResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ConnectorBulkSyncItemResult' }
    ConnectorBulkReauthRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
          description: Explicit connector IDs to re-authenticate — never "all matching the current filter".
    ConnectorBulkReauthItemResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [success, error] }
        reason:
          type: string
          description: 'Present when status is error, e.g. not_found, or the refresh failure.'
    ConnectorBulkReauthResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ConnectorBulkReauthItemResult' }
    ConnectorBulkRestartRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          items: { type: string }
          description: Explicit connector IDs to restart — never "all matching the current filter".
    ConnectorBulkRestartItemResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [success, error] }
        reason:
          type: string
          description: 'Present when status is error, e.g. not_found, or the restart failure.'
    ConnectorBulkRestartResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ConnectorBulkRestartItemResult' }
    Diff:
      type: object
      description: >
        Generic diff consumed by the unified DiffViewer (§8.2). Two shapes keyed
        by `format`:
          - `infra`: structured key-path before/after rows → `hunks`.
          - `doc`: full before/after document revisions → `baseText`/`headText`;
            the frontend computes the line + word diff (JetBrains-IDE style).
        `hunks` is therefore required only for `infra`; `baseText`/`headText` only
        for `doc`.
      required: [format]
      properties:
        format: { type: string, enum: [infra, doc], description: Picks the DiffViewer formatter }
        hunks:
          type: array
          description: infra format only — per-path before/after rows
          items:
            type: object
            required: [before, after]
            properties:
              path: { type: string }
              before: { type: string, nullable: true }
              after: { type: string, nullable: true }
        baseText:
          type: string
          description: doc format only — full text of the "before" revision
        headText:
          type: string
          description: doc format only — full text of the "after" revision
        baseLabel: { type: string, description: 'doc format — label for the before revision, e.g. "rev 11"' }
        headLabel: { type: string, description: 'doc format — label for the after revision, e.g. "rev 12"' }
        headTrigger: { type: string, description: 'doc format — provenance of the head revision, e.g. "manual", "ai:claude-sonnet-5", "template"' }
        language:
          type: string
          enum: [md, yaml, text]
          description: doc format — content hint; raw-text render for v1

    # ── alerts ──
    Alert:
      type: object
      required: [id, serviceId, severity, title, status, createdAt]
      properties:
        id: { type: string }
        changeId: { type: string, nullable: true }
        serviceId: { type: string }
        serviceName: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/AlertStatus' }
        createdAt: { type: string, format: date-time }
        snoozedUntil: { type: string, format: date-time, nullable: true }
    AlertPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ── attention queue ──
    AttentionItem:
      type: object
      required: [id, kind, severity, title, connectorId, detectedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [alert, finding] }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        connectorId: { type: string }
        detectedAt: { type: string, format: date-time }
        changeId: { type: string, nullable: true }
        checkType: { type: string, nullable: true }
        runbookId: { type: string, nullable: true }
    AttentionPage:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AttentionItem' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ── runbooks ──
    RunbookTargetType:
      type: string
      enum: [change_type, alert_severity, finding_check_type]
    RunbookStepVerb:
      type: string
      enum: [restart, start, stop]
    RunbookStep:
      type: object
      required: [id, position, title, connectorId, connectorName, verb, entityRef, canExecute, executeBlockedReason]
      properties:
        id: { type: string }
        position: { type: integer, description: 'Order within the runbook, 0-based; matches the steps array index.' }
        title: { type: string }
        connectorId: { type: string }
        connectorName: { type: string, description: "The referenced connector's display name, for rendering without a second lookup." }
        verb: { $ref: '#/components/schemas/RunbookStepVerb' }
        entityRef:
          type: string
          description: >
            Target entity's SnapshotEntity.externalId, or empty for
            connectors that manage a single implicit service.
        canExecute:
          type: boolean
          description: Whether the calling user currently holds at least an operator grant on connectorId.
        executeBlockedReason:
          type: string
          enum: ['', no_operator_grant]
          description: Empty when canExecute is true; "no_operator_grant" otherwise.
    RunbookStepInput:
      type: object
      required: [title, connectorId, verb]
      properties:
        id:
          type: string
          description: >
            An existing step's ID, to keep it (and its identity in audit
            history) across a replace-all update. Omit for a new step, or
            when creating a runbook; any ID that didn't already belong to
            this runbook is ignored and a fresh one is generated.
        title: { type: string }
        connectorId: { type: string }
        verb: { $ref: '#/components/schemas/RunbookStepVerb' }
        entityRef: { type: string, default: '' }
    Runbook:
      type: object
      required: [id, title, body, targetType, targetValue, steps, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        targetType: { $ref: '#/components/schemas/RunbookTargetType' }
        targetValue:
          type: string
          description: >
            A changeType value (e.g. vm.created) when targetType=change_type,
            a Severity value when targetType=alert_severity, or a quality
            finding check type when targetType=finding_check_type.
        snapshotId: { type: string, nullable: true, description: "Known-good ServiceSnapshot to point at, if any" }
        docId: { type: string, nullable: true }
        steps:
          type: array
          items: { $ref: '#/components/schemas/RunbookStep' }
          description: >
            Connector lifecycle operations this runbook points at, in
            position order. Linking a step grants no mutation permission by
            itself — see canExecute.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RunbookPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Runbook' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    RunbookCreate:
      type: object
      required: [title, targetType, targetValue]
      properties:
        title: { type: string }
        body: { type: string, default: '' }
        targetType: { $ref: '#/components/schemas/RunbookTargetType' }
        targetValue: { type: string }
        snapshotId: { type: string, nullable: true }
        docId: { type: string, nullable: true }
        steps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RunbookStepInput' }
    RunbookUpdate:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        targetType: { $ref: '#/components/schemas/RunbookTargetType' }
        targetValue: { type: string }
        snapshotId: { type: string, nullable: true }
        docId: { type: string, nullable: true }
        steps:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/RunbookStepInput' }
          description: >
            Omit this key entirely to leave the runbook's steps unchanged;
            include it (even as []) to replace all steps.

    # ── documentation quality findings ──
    QualityFinding:
      type: object
      required:
        [id, connectorId, connectorName, docId, ruleId, checkType, severity, title, description, remediationLink, status, detectedCount, firstDetectedAt, lastSeenAt, resolvedAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        connectorName: { type: string }
        docId: { type: string, nullable: true }
        entityKind: { type: string }
        entityRef: { type: string }
        ruleId: { type: string, nullable: true }
        checkType: { $ref: '#/components/schemas/QualityCheckType' }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        description: { type: string }
        remediationLink: { type: string }
        status: { $ref: '#/components/schemas/QualityFindingStatus' }
        detectedCount: { type: integer, minimum: 1 }
        firstDetectedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    QualityFindingPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QualityFinding' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ── notification center ──
    Notification:
      type: object
      required: [id, eventType, title, message, read, createdAt]
      properties:
        id: { type: string }
        alertId: { type: string, nullable: true, description: 'Deep-link target when set — the affected alert.' }
        eventType: { type: string, description: 'e.g. alert.created, finding.created, system.job_failed, digest.summary' }
        title: { type: string }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    NotificationDelivery:
      type: object
      description: One channel delivery attempt for a notification (operator visibility into failures/retries).
      required: [id, notificationId, channel, status, attempts, createdAt, updatedAt]
      properties:
        id: { type: string }
        notificationId: { type: string }
        channel: { $ref: '#/components/schemas/NotificationChannelType' }
        status: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer }
        lastError: { type: string }
        nextAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NotificationDeliveryPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    # ── saved views ──
    SavedViewSurface:
      type: string
      enum: [services, changes, alerts]
    SavedView:
      type: object
      description: A user's named, reusable filter set for one list surface (docs/SAVED_VIEWS.md).
      required: [id, userId, surface, name, filters, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        surface: { $ref: '#/components/schemas/SavedViewSurface' }
        name: { type: string }
        filters:
          type: string
          description: Opaque JSON blob; the backend never inspects its shape — each frontend list surface owns it.
        createdAt: { type: string, format: date-time }
    SavedViewCreate:
      type: object
      required: [surface, name]
      properties:
        surface: { $ref: '#/components/schemas/SavedViewSurface' }
        name: { type: string }
        filters:
          type: object
          description: The current filter state of the surface, as a JSON object. Stored opaquely.

    # ── settings ──
    AuthConfig:
      type: object
      required: [localEnabled, accessTokenTtl, refreshTokenTtl, stepUpForDestructive, require2fa, oidcProviders]
      properties:
        localEnabled: { type: boolean }
        accessTokenTtl: { type: integer, description: seconds }
        refreshTokenTtl: { type: integer, description: seconds }
        stepUpForDestructive:
          type: boolean
          description: >
            Require step-up re-auth (POST /auth/elevate) before destructive ops.
            Defaults on; the escape hatch for a single-admin homelab.
        require2fa:
          type: string
          enum: [none, admins, all]
          description: >-
            Instance-wide 2FA policy for local accounts (#279). A covered user
            who hasn't enrolled a factor gets an enrollment-only session at
            their next login. Changing this doesn't touch existing sessions.
        oidcProviders:
          type: array
          description: Read-only; defined in config/env, not editable via API
          items: { $ref: '#/components/schemas/OidcProvider' }
    AuthSettingsUpdate:
      type: object
      description: Mutable subset of AuthConfig (no providers, no credentials)
      properties:
        localEnabled: { type: boolean }
        accessTokenTtl: { type: integer, description: seconds }
        refreshTokenTtl: { type: integer, description: seconds }
        stepUpForDestructive: { type: boolean }
        require2fa: { type: string, enum: [none, admins, all] }
    ElevationRequest:
      type: object
      description: >-
        One of `password` (no confirmed factor) or `totp`/`recoveryCode`
        (confirmed factor) proves the caller's identity for step-up; see GET
        /auth/elevate/methods.
      required: [action]
      properties:
        action:
          type: string
          description: The elevation action being requested, e.g. "connector.delete", "user.delete"
        target:
          type: string
          description: >-
            ID of the resource the token is bound to, for actions on one (the user
            for `user.delete`, `user.resetPassword`, `user.resetMfa`, `user.update`;
            the provider for `authProvider.toggle`). The token is also bound to the
            caller's session and is single-use.
        password: { type: string, format: password }
        totp: { type: string, description: 6-digit TOTP code when 2FA is configured }
        recoveryCode: { type: string, description: 'A single-use recovery code, used instead of totp' }
        webauthn: { $ref: '#/components/schemas/WebAuthnResponse' }
    ElevationToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string, description: Replay in X-Elevation-Token on the destructive request }
        expiresAt: { type: string, format: date-time }
    RemovalImpact:
      type: object
      description: Concrete dependents destroyed by removing a connector (blast radius).
      required: [trackedServices, docSections, snapshots, items]
      properties:
        trackedServices: { type: integer }
        docSections: { type: integer }
        snapshots: { type: integer }
        items:
          type: array
          description: Named dependents, for an explicit "this is what you destroy" list
          items:
            type: object
            required: [type, name]
            properties:
              type: { type: string, description: 'e.g. service, doc-section, snapshot' }
              name: { type: string }
    RestartPreview:
      type: object
      description: Non-mutating preview of the future service.restart action.
      required: [targetService, estimatedDowntimeSeconds, dependentServices]
      properties:
        targetService: { type: string }
        estimatedDowntimeSeconds: { type: integer, minimum: 0, example: 30 }
        affectedEntities:
          type: array
          description: Names of devices the target powers or carries (e.g. the APs and cameras behind a UniFi PoE port); the blast radius of the action. Empty when the target declares none.
          items: { type: string }
        dependentServices:
          type: array
          items:
            type: object
            required: [kind, name]
            properties:
              kind: { type: string, description: 'e.g. host, network, storage, upstream_service' }
              name: { type: string }
              ref: { type: string }
    ConfigField:
      type: object
      description: One field a connector exposes for config-push (ADR 0003).
      required: [key, label, type, entityScope]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, description: 'Reuses the SchemaField Type vocabulary (text, number, toggle, select, ...).' }
        entityScope: { type: boolean, description: 'true if per-entity (requires entityRef), false if connector-global.' }
    OidcProvider:
      type: object
      description: >
        File/env-defined provider, surfaced read-only. issuerUrl, clientId, and the
        secret are never accepted or returned over the API; `secretConfigured` only
        signals whether the secret is present in config.
      required: [id, displayName, issuerUrl, clientId, secretConfigured, enabled, source]
      properties:
        id: { type: string }
        displayName: { type: string }
        issuerUrl: { type: string, readOnly: true }
        clientId: { type: string, readOnly: true }
        secretConfigured: { type: boolean, readOnly: true }
        enabled:
          type: boolean
          description: 'The one mutable flag (via PUT /auth/providers/{providerId}/enabled)'
        source: { type: string, enum: [file, env], readOnly: true }
        scopes:
          type: array
          readOnly: true
          items: { type: string }
    AiConfig:
      type: object
      required: [enabled, mode]
      properties:
        enabled: { type: boolean }
        provider: { type: string, enum: [anthropic, openai, ollama], nullable: true }
        model: { type: string }
        apiKey: { type: string, description: Write-only; omitted in responses }
        baseUrl: { type: string, description: For Ollama / self-hosted }
        mode: { type: string, enum: [auto_update, suggest_only], description: How diffs route (§2) }
    AiFallbackProvider:
      type: object
      required: [provider]
      description: >
        One entry in the ordered fallback chain (priority 2+, since the primary
        AiConfig.provider is implicitly priority 1). Tried in list order when the
        provider before it errors with 429, 5xx, or a timeout.
      properties:
        provider: { type: string, enum: [anthropic, openai, ollama] }
        model: { type: string }
        apiKey: { type: string, description: Write-only; omitted in responses }
        baseUrl: { type: string, description: For Ollama / self-hosted }
    NotificationConfig:
      type: object
      required: [channels, routing]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
        routing:
          type: array
          description: Full event×channel matrix (§8.8)
          items: { $ref: '#/components/schemas/NotificationRoute' }
    NotificationChannelType:
      type: string
      enum: [in_app, smtp, webhook, discord, slack, ntfy, telegram, gotify, pushover, matrix, apprise]
    NotificationChannel:
      type: object
      required: [type, enabled]
      properties:
        type: { $ref: '#/components/schemas/NotificationChannelType' }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
          description: >
            Channel-specific, keyed by type (see docs/NOTIFICATIONS.md for the full field
            reference per channel):
              - webhook: { url, secret } — generic JSON POST, HMAC-signed when a secret is set.
              - discord / slack: { url, secret } — incoming-webhook URL; secret HMAC-signs the
                request the same way the generic webhook channel does.
              - ntfy: { url (server, default https://ntfy.sh), topic, priority, tags } — publishes
                via ntfy's HTTP API.
              - telegram: { chatId, secret } — secret is the bot token; sends via the Bot API's
                sendMessage.
              - gotify: { url (server), priority } — secret is the app token (sent as X-Gotify-Key).
              - pushover: { userKey, device, priority } — secret is the application token.
              - matrix: { url (homeserver), roomId } — secret is the access token.
              - apprise: { url (Apprise API server), configKey or urls, tag } — secret is an optional
                bearer token.
              - smtp: { host, port, username, secret, from, to } — secret is the SMTP password;
                sent with opportunistic STARTTLS.
            "secret" is write-only: webhook/Discord/Slack sign deliveries with HMAC-SHA256
            (X-WiseLabz-Timestamp and X-WiseLabz-Signature headers) when set; Telegram and SMTP
            reuse the same field for their own credential (bot token / password). It is stored
            encrypted and never returned; reads expose secretSet instead.
    NotificationRoute:
      type: object
      required: [eventType, channel, enabled]
      properties:
        eventType: { type: string, description: 'Event type the route applies to. Emitted today: alert.created, finding.created, system.job_failed (scheduled job failing/recovered).' }
        channel: { $ref: '#/components/schemas/NotificationChannelType' }
        enabled: { type: boolean }
        minSeverity: { $ref: '#/components/schemas/Severity' }
        connectorCategory: { type: string, description: 'Optional connector category filter; empty/absent matches any category.' }
        connectorId: { type: string, description: 'Optional connector ID filter; empty/absent matches any connector.' }

    # ── system ──
    SystemInfo:
      type: object
      required: [version, syncSchedule, integrations]
      properties:
        version: { type: string }
        syncSchedule: { type: string, description: cron expression }
        integrations:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, degraded, down] }
              detail: { type: string }
    Health:
      type: object
      required: [status, healthy, components]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        healthy: { type: boolean, description: True when every required component is healthy. }
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, degraded, down] }
              detail: { type: string }
    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Readiness:
      type: object
      required: [status, ready, components]
      properties:
        status: { type: string, enum: [ok, degraded] }
        ready: { type: boolean }
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, down, pending, dirty, unknown] }

    # ── audit ──
    AuditRecord:
      type: object
      description: One audit trail entry (docs/AUDIT.md). Written only after the audited action succeeds.
      required: [id, actorUserId, actorRole, action, targetType, targetId, detail, createdAt]
      properties:
        id: { type: string }
        actorUserId: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string, description: 'e.g. connector.create, doc.restore' }
        targetType: { type: string, description: 'e.g. connector, doc; empty when the action has no single target' }
        targetId: { type: string }
        detail:
          type: string
          description: Small JSON object, action-specific; never carries secret values (e.g. changed field names, not their values)
        createdAt: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        nextCursor:
          type: string
          description: >-
            Cursor for the next keyset page. Present only when the request sent
            `cursor` and more rows follow; absent for offset requests and on the
            last page.

    # ── backup ──
    BackupBundle:
      type: object
      description: >-
        Portable backup format (docs/BACKUP.md). Connector secret fields
        (per each connector type's schema) are redacted from `configData`;
        `aiConfig` never includes the provider API key; notification channel
        config is not included at all.
      required: [version, exportedAt, connectors, docs, docVersions, templates, templateSections]
      properties:
        journalEntries:
          type: array
          items: { $ref: '#/components/schemas/JournalEntry' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/DocAttachment' }
        version: { type: integer, enum: [1, 2], description: v1 JSON or v2 ZIP bundle metadata }
        exportedAt: { type: string, format: date-time }
        connectors:
          type: array
          items: { $ref: '#/components/schemas/Connector' }
        docs:
          type: array
          items: { $ref: '#/components/schemas/Doc' }
        docVersions:
          type: array
          items: { $ref: '#/components/schemas/DocVersion' }
        templates:
          type: array
          items:
            type: object
            description: Flat template record (id, name, description, appliesTo, timestamps) — not the nested Template schema used elsewhere
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
              appliesTo: { type: string }
              createdAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
        templateSections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              templateId: { type: string }
              title: { type: string }
              order: { type: integer }
              body: { type: string }
        aiConfig:
          type: object
          description: Informational only; never applied on import — the encrypted API key can't be restored from a backup
          properties:
            enabled: { type: boolean }
            provider: { type: string }
            model: { type: string }
            baseUrl: { type: string }
            mode: { type: string }
    BackupCounts:
      type: object
      required: [imported, skipped]
      properties:
        imported: { type: integer }
        skipped: { type: integer, description: Existing record with the same ID was left untouched }
    BackupImportResult:
      type: object
      required: [connectors, docs, docVersions, templates, templateSections]
      properties:
        journalEntries: { $ref: '#/components/schemas/BackupCounts' }
        attachments: { $ref: '#/components/schemas/BackupCounts' }
        connectors: { $ref: '#/components/schemas/BackupCounts' }
        docs: { $ref: '#/components/schemas/BackupCounts' }
        docVersions: { $ref: '#/components/schemas/BackupCounts' }
        templates: { $ref: '#/components/schemas/BackupCounts' }
        templateSections: { $ref: '#/components/schemas/BackupCounts' }
    RetentionSettings:
      type: object
      required: [snapshotDays, docVersionDays, alertDays, syncRunDays, auditDays, healthCheckDays, reportDays, cronExpr]
      properties:
        snapshotDays: { type: integer, description: Delete service snapshots older than this many days; 0 disables cleanup for this category }
        docVersionDays: { type: integer, description: Delete doc revisions older than this many days; 0 disables cleanup for this category }
        alertDays: { type: integer, description: Delete resolved/dismissed alerts older than this many days; 0 disables cleanup for this category }
        syncRunDays: { type: integer, description: Delete sync run history older than this many days; 0 disables cleanup for this category }
        auditDays: { type: integer, description: Delete audit log records older than this many days; 0 disables cleanup for this category }
        healthCheckDays: { type: integer, description: Delete health-check time-series rows older than this many days; 0 disables cleanup for this category }
        deletedDocsDays: { type: integer, minimum: 0, default: 30, description: Permanently purge trash older than this many days; 0 disables cleanup }
        reportDays: { type: integer, description: Delete generated reports older than this many days; 0 disables cleanup for this category }
        cronExpr: { type: string, description: 5-field or 6-field (with leading seconds) cron expression, example: '0 0 * * *' }
        updatedAt: { type: string, format: date-time }
    BackupSchedule:
      type: object
      required: [cronExpr, maxBackups, maxAgeHours, enabled]
      properties:
        cronExpr: { type: string, description: 5-field or 6-field (with leading seconds) cron expression, example: '0 3 * * *' }
        maxBackups: { type: integer, description: Keep at most this many recent backups; 0 or negative disables count-based pruning }
        maxAgeHours: { type: integer, description: Delete backups older than this many hours; 0 disables age-based pruning. Negative values are rejected with 400 on write (a legacy stored negative is treated as 0) }
        enabled: { type: boolean, description: Whether the backup job is registered with the scheduler }
        updatedAt: { type: string, format: date-time }
    BackupRun:
      type: object
      required: [id, triggeredBy, filePath, sizeBytes, createdAt]
      properties:
        id: { type: string }
        triggeredBy: { type: string, enum: [schedule, manual] }
        filePath: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
    BackupRunPage:
      type: object
      required: [runs, total, limit, offset]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/BackupRun' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    JobInfo:
      type: object
      required: [name, cronExpr]
      properties:
        name: { type: string, description: 'Job name, e.g. "quality", "sync", "backup", "docexport"' }
        cronExpr: { type: string, description: 5-field or 6-field (with leading seconds) cron expression }
        lastStatus: { type: string, enum: [ok, failing], description: Absent if the job has never run yet }
        lastError: { type: string, description: Error from the most recent failing run; empty when lastStatus is ok }
        lastRunAt: { type: string, format: date-time, description: Absent if the job has never run yet }
        lastSuccessAt: { type: string, format: date-time, description: Absent if the job has never succeeded }
        lastFailureAt: { type: string, format: date-time, description: Absent if the job has never failed }
        nextRunAt: { type: string, format: date-time, description: Next scheduled run per the live cron entry }

    # ── diagnostics ──
    DiagnosticsBundle:
      type: object
      description: >-
        Sanitized support bundle (docs/DIAGNOSTICS.md). Connector secret
        fields are redacted the same way as the backup bundle; notification
        channel config, OIDC client secrets, and the AI provider API key are
        never included.
      required: [generatedAt, health, versions, sanitizedConfig, recentFailures]
      properties:
        generatedAt: { type: string, format: date-time }
        health: { $ref: '#/components/schemas/Health' }
        versions:
          type: object
          properties:
            goVersion: { type: string }
            version: { type: string }
            commit: { type: string }
            buildTime: { type: string }
        sanitizedConfig:
          type: object
          properties:
            connectors:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  type: { type: string }
                  category: { type: string }
                  enabled: { type: boolean }
                  configData: { type: string, description: JSON-encoded config with password fields redacted }
            syncSchedule: { type: string, description: cron expression }
            authProviders:
              type: object
              properties:
                local: { type: boolean }
                oidc:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      displayName: { type: string }
            aiConfig:
              type: object
              description: Same shape as BackupBundle.aiConfig
              properties:
                enabled: { type: boolean }
                provider: { type: string }
                model: { type: string }
                baseUrl: { type: string }
                mode: { type: string }
        recentFailures:
          type: object
          properties:
            syncRuns:
              type: array
              items:
                type: object
                properties:
                  connectorId: { type: string }
                  connectorName: { type: string }
                  startedAt: { type: string, format: date-time }
                  error: { type: string }
            deliveries:
              type: array
              items:
                type: object
                description: Delivery attempt record only — never the channel's own config
                properties:
                  id: { type: string }
                  notificationId: { type: string }
                  channel: { $ref: '#/components/schemas/NotificationChannelType' }
                  status: { type: string, enum: [pending, sent, failed] }
                  attempts: { type: integer }
                  lastError: { type: string }
                  nextAttemptAt: { type: string, format: date-time }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }

    # ── scheduled reports (#280) ──
    ReportSection:
      type: string
      description: One report section, matching internal/report.Sections's fields.
      enum: [docs, compliance, rotations, quality, drift, jobs]
    ReportChannelType:
      type: string
      description: >-
        Channel TYPES a report definition delivers to (plan Q13) — channels
        have no IDs; delivery bypasses the normal routing rules and goes
        straight to every enabled channel of these types.
      enum: [slack, discord, webhook, email]
    ReportTrigger:
      type: string
      enum: [scheduled, manual]
    ReportStatus:
      type: string
      description: '`partial` means one or more sections failed (plan Q21); the report is still stored and delivered.'
      enum: [ok, partial]
    ReportDefinition:
      type: object
      required:
        [id, slug, name, enabled, cronExpr, timezone, sections, connectorIds, channels, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string, description: Immutable after creation; used in the cron job name `report:<slug>` and in download filenames. }
        name: { type: string }
        enabled: { type: boolean }
        attachLabBook: { type: boolean, default: false, description: Attach a scoped offline HTML Lab Book to email and Discord deliveries; oversized attachments fall back to text. }
        cronExpr: { type: string, description: 5-field or 6-field (with leading seconds) cron expression, example: '0 6 * * 1' }
        timezone: { type: string, description: 'IANA zone name, e.g. "America/New_York". Applied as a CRON_TZ= prefix on cronExpr.' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/ReportSection' }
        connectorIds:
          type: array
          items: { type: string }
          description: >-
            Optional connector filter (plan Q14) applied to every section
            except job health, which always covers every job.
        channels:
          type: array
          items: { $ref: '#/components/schemas/ReportChannelType' }
        createdBy: { type: string, description: User ID of the operator who created this definition. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReportDefinitionInput:
      type: object
      required: [slug, name, enabled, cronExpr, timezone, sections]
      properties:
        slug: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        attachLabBook: { type: boolean, default: false, description: Attach a scoped offline HTML Lab Book to email and Discord deliveries; oversized attachments fall back to text. }
        cronExpr: { type: string }
        timezone: { type: string }
        sections:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReportSection' }
        connectorIds:
          type: array
          items: { type: string }
        channels:
          type: array
          items: { $ref: '#/components/schemas/ReportChannelType' }

    ReportDocChangeEntry:
      type: object
      required: [docId, title, connectorId, connectorName, version, changedAt]
      properties:
        docId: { type: string }
        title: { type: string }
        connectorId: { type: string }
        connectorName: { type: string }
        version: { type: integer }
        changedAt: { type: string, format: date-time }
    ReportDocsSection:
      type: object
      required: [total, items]
      properties:
        error: { type: string, description: Present when this section's underlying query failed; the report is still stored/delivered as `partial`. }
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportDocChangeEntry' }
    ReportFindingSummary:
      type: object
      required: [id, connectorId, connectorName, checkType, severity, title, status, detectedAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        connectorName: { type: string }
        checkType: { $ref: '#/components/schemas/QualityCheckType' }
        severity: { $ref: '#/components/schemas/Severity' }
        title: { type: string }
        status: { $ref: '#/components/schemas/QualityFindingStatus' }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
    ReportComplianceSection:
      type: object
      required: [openCount, detectedCount, resolvedCount, items]
      properties:
        error: { type: string }
        openCount: { type: integer, description: Findings with check_type=compliance still open as of report generation. }
        detectedCount: { type: integer, description: check_type=compliance findings first detected during the window. }
        resolvedCount: { type: integer, description: check_type=compliance findings resolved during the window. }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportFindingSummary' }
    ReportQualitySection:
      type: object
      required: [openCount, detectedCount, resolvedCount, items]
      description: Same shape as ReportComplianceSection, covering every check_type except compliance and credential_rotation.
      properties:
        error: { type: string }
        openCount: { type: integer }
        detectedCount: { type: integer }
        resolvedCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportFindingSummary' }
    ReportRotationEntry:
      type: object
      required: [connectorId, connectorName, overdue, dueSoon]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        rotatedAt: { type: string, format: date-time, nullable: true }
        overdue: { type: boolean }
        dueSoon: { type: boolean }
    ReportRotationsSection:
      type: object
      required: [rotated, overdue, dueSoon]
      properties:
        error: { type: string }
        rotated:
          type: array
          items: { $ref: '#/components/schemas/ReportRotationEntry' }
          description: Connectors whose secretRotatedAt fell inside the window.
        overdue:
          type: array
          items: { $ref: '#/components/schemas/ReportRotationEntry' }
          description: Connectors with an open, overdue credential_rotation finding as of now.
        dueSoon:
          type: array
          items: { $ref: '#/components/schemas/ReportRotationEntry' }
          description: Connectors with an open credential_rotation finding due soon (not yet overdue) as of now.
    ReportSeverityCounts:
      type: object
      required: [info, warning, critical]
      properties:
        info: { type: integer }
        warning: { type: integer }
        critical: { type: integer }
    ReportConnectorDrift:
      type: object
      required: [connectorId, connectorName, counts]
      properties:
        connectorId: { type: string }
        connectorName: { type: string }
        counts: { $ref: '#/components/schemas/ReportSeverityCounts' }
    ReportChangeEntry:
      type: object
      required: [id, connectorId, connectorName, severity, summary, detectedAt]
      properties:
        id: { type: string }
        connectorId: { type: string }
        connectorName: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        summary: { type: string }
        detectedAt: { type: string, format: date-time }
    ReportDriftSection:
      type: object
      required: [total, byConnector, topChanges]
      properties:
        error: { type: string }
        total: { type: integer, description: Total changes detected in the window (optionally filtered by connectorIds). }
        byConnector:
          type: array
          items: { $ref: '#/components/schemas/ReportConnectorDrift' }
        topChanges:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/ReportChangeEntry' }
          description: The 10 most severe changes in the window (plan Q19).
    ReportJobHealthEntry:
      type: object
      required: [name, status]
      description: Mirrors one row of GET /system/jobs (PR1, #384).
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, failing] }
        lastError: { type: string }
        lastRunAt: { type: string, format: date-time, nullable: true }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
    ReportJobsSection:
      type: object
      required: [failingCount, items]
      description: Always covers every job, ignoring the definition's connectorIds filter (plan Q14).
      properties:
        error: { type: string }
        failingCount: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportJobHealthEntry' }
    ReportSections:
      type: object
      required: [docs, compliance, rotations, quality, drift, jobs]
      properties:
        docs: { $ref: '#/components/schemas/ReportDocsSection' }
        compliance: { $ref: '#/components/schemas/ReportComplianceSection' }
        rotations: { $ref: '#/components/schemas/ReportRotationsSection' }
        quality: { $ref: '#/components/schemas/ReportQualitySection' }
        drift: { $ref: '#/components/schemas/ReportDriftSection' }
        jobs: { $ref: '#/components/schemas/ReportJobsSection' }
    ReportDefinitionSummary:
      type: object
      required: [slug, name]
      description: Snapshot of the definition that produced a report, captured at generation time so it survives the definition being edited or deleted.
      properties:
        slug: { type: string }
        name: { type: string }
    ReportData:
      type: object
      required: [definition, periodStart, periodEnd, truncated, sections]
      description: The typed JSON payload stored on a report row; also what Markdown/HTML are rendered from.
      properties:
        definition: { $ref: '#/components/schemas/ReportDefinitionSummary' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        truncated: { type: boolean, description: True when the window exceeded the 31-day cap and was clamped (plan Q22). }
        sections: { $ref: '#/components/schemas/ReportSections' }
    ReportSummary:
      type: object
      required: [id, definitionId, definitionName, trigger, periodStart, periodEnd, truncated, status, createdAt]
      properties:
        id: { type: string }
        definitionId: { type: string, nullable: true, description: Null if the definition was since deleted. }
        definitionName: { type: string, description: Copied at generation time; stable even if the definition is renamed or deleted. }
        trigger: { $ref: '#/components/schemas/ReportTrigger' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        truncated: { type: boolean }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
    Report:
      type: object
      description: ReportSummary plus the full typed data and rendered Markdown, returned by GET /reports/{reportId}.
      required: [id, definitionId, definitionName, trigger, periodStart, periodEnd, truncated, status, createdAt, data, markdown]
      properties:
        id: { type: string }
        definitionId: { type: string, nullable: true }
        definitionName: { type: string }
        trigger: { $ref: '#/components/schemas/ReportTrigger' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        truncated: { type: boolean }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/ReportData' }
        markdown: { type: string, description: 'Pre-rendered Markdown, stored at generation time. HTML is rendered on demand from `data` instead (see GET /reports/{reportId}/download).' }
    ReportPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportSummary' }
        nextCursor:
          type: string
          description: Cursor for the next keyset page (see the shared Cursor parameter); absent on the last page.
