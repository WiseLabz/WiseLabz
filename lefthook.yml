# Which checks run is decided by scripts/hooks/areas.sh, which reuses the CI
# classifier (scripts/ci/changes.sh). LEFTHOOK_FULL=1 forces every check.
pre-commit:
  parallel: true
  commands:
    skip-notice:
      priority: 1
      skip:
        - run: "! scripts/hooks/areas.sh skip-all"
      run: scripts/hooks/areas.sh notice
    gofmt:
      priority: 2
      glob: "*.go"
      skip:
        - run: scripts/hooks/areas.sh skip backend
      run: |
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "Unformatted Go files:"
          echo "$unformatted"
          exit 1
        fi
    golangci-lint:
      priority: 2
      skip:
        - run: scripts/hooks/areas.sh skip backend
      run: |
        if [ -n "$(find ./backend -name '*.go' -type f)" ]; then
          golangci-lint run --new-from-rev=HEAD ./backend/...
        fi
    go-test:
      priority: 2
      skip:
        - run: scripts/hooks/areas.sh skip backend
      run: |
        if [ -n "$(find ./backend -name '*_test.go' -type f)" ]; then
          go test -short ./backend/...
        else
          echo "No test files yet, skipping"
        fi
    web-lint:
      priority: 2
      skip:
        - run: scripts/hooks/areas.sh skip frontend
      # Regenerate the API client first when the spec is staged, so the lint
      # never reads files that are being rewritten.
      run: |
        if ! git diff --cached --quiet -- docs/openapi.yaml; then
          bun run --cwd web gen:api
          git add web/src/api/generated web/src/api/model
        fi
        bun run --cwd web lint
    actionlint:
      priority: 2
      skip:
        - run: scripts/hooks/areas.sh skip workflows
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint
        else
          echo "actionlint not installed, skipping workflow lint"
        fi

commit-msg:
  commands:
    conventional-commits:
      run: |
        regex='^(feat|fix|docs|chore|refactor|test|ci|perf|revert)(\(.+\))?: .{1,100}'
        if ! head -1 "$(git rev-parse --git-path COMMIT_EDITMSG)" | grep -qE "$regex"; then
          echo "ERROR: Commit message does not follow Conventional Commits format."
          echo ""
          echo "Format: <type>(<scope>): <short description>"
          echo "Types: feat, fix, docs, chore, refactor, test, ci, perf, revert"
          echo ""
          echo "WiseLabz example:"
          echo "  feat(connector): add Proxmox VM snapshot support"
          exit 1
        fi
