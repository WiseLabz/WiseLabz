name: Release

on:
  push:
    tags: ["v*.*.*"]

# Each job lists what it needs: a job-level block replaces this one.
permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Image
    # Can run on the self-hosted runner named by the RELEASE_RUNNER repository
    # variable (unset = GitHub-hosted). Tag pushes are trusted events; the
    # runner needs Docker with buildx.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      # Build provenance attestation: OIDC token for the signing certificate,
      # and the attestations API to store it.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/wiselabz/wiselabz
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # Pushes the image by digest only, with no tag. The version, major.minor
      # and latest tags are applied after the CRITICAL gate below has passed, so
      # a failed gate leaves an untagged digest and no tag moves.
      - name: Build and push (untagged)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/wiselabz/wiselabz,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/wiselabz/wiselabz@${{ steps.build.outputs.digest }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"

      - name: Scan image for vulnerabilities (gate on critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/wiselabz/wiselabz@${{ steps.build.outputs.digest }}
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/wiselabz/wiselabz@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          artifact-name: sbom.cdx.json
          # The upload-sbom job attaches it to the release; this job has no
          # contents: write.
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/wiselabz/wiselabz
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Points every release tag at the scanned and attested digest without
      # rebuilding or copying layers.
      - name: Apply release tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [[ -n $tag ]] && tag_args+=(--tag "$tag")
          done <<<"$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "ghcr.io/wiselabz/wiselabz@$DIGEST"

  upload-sbom:
    name: Upload SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-and-push]

    permissions:
      contents: write

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom.cdx.json

      - name: Upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
