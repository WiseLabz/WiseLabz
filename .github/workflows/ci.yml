name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review: drafts defer the heavy jobs, so marking a PR ready
    # re-runs CI on the same commit with the full job selection.
    types: [opened, synchronize, reopened, ready_for_review]
  # The main ruleset merges through a merge queue, which needs CI Status on
  # the queued commit. Changes are classified from the queue's base to head.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # No Go here: every other job waits for this one. The Postgres closure,
    # which needs Go, runs inside each Postgres shard instead.
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      compose: ${{ steps.classify.outputs.compose }}
      workflows: ${{ steps.classify.outputs.workflows }}
      gomod: ${{ steps.classify.outputs.gomod }}
      files: ${{ steps.filter.outputs.all_files }}
      draft: ${{ github.event.pull_request.draft == true }}
      race_shards: ${{ steps.shards.outputs.race }}
      postgres_shards: ${{ steps.shards.outputs.postgres }}

    steps:
      # Depth 2: on pull_request HEAD is the merge commit and HEAD^1 the base,
      # which the web/package.json version-only rule compares against.
      # The one checkout that keeps its credentials: on push and merge_group
      # events, paths-filter runs `git fetch origin` for the base and head.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Only lists the changed files; scripts/ci/changes.sh decides what they
      # mean (see "What CI runs" in docs/TESTING.md).
      - name: List changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            all:
              - '**'

      - name: Check classification rules
        run: scripts/ci/changes.sh check

      - name: Check CI status gate
        run: scripts/ci/status-test.sh

      - name: Check cache pruning rules
        run: scripts/ci/cache-prune.sh check

      - name: Check changed-lines coverage rules
        run: scripts/ci/changed-lines-coverage-test.sh

      - name: Classify changes
        id: classify
        env:
          FILES: ${{ steps.filter.outputs.all_files }}
          CI_EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          # An empty list would select nothing, so treat it as an error.
          if [[ -z $FILES ]]; then
            echo "::error::paths-filter returned no file list"
            exit 1
          fi
          jq -r '.[]' <<<"$FILES" |
            CHANGES_SUMMARY="$GITHUB_STEP_SUMMARY" scripts/ci/changes.sh classify >> "$GITHUB_OUTPUT"
          if [[ $DRAFT == true ]]; then
            echo "**Draft: heavy jobs deferred** until the PR is marked ready for review." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Shard names come from scripts/ci/test-shards.json, the single place
      # shards are defined; see scripts/ci/test-shards.sh.
      - name: Load test shard matrices
        id: shards
        run: |
          for suite in race postgres; do
            echo "$suite=$(scripts/ci/test-shards.sh matrix "$suite")" >> "$GITHUB_OUTPUT"
          done

  actionlint:
    name: Lint (Workflows)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest ships shellcheck, which actionlint runs on run: blocks.
      - name: Download actionlint
        id: actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      - name: Run actionlint
        run: ${{ steps.actionlint.outputs.executable }} -color

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    # The shard check compiles test packages to list their tests.
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: lint

      - name: Check gofmt
        run: |
          unformatted=$(find ./backend -name '*.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
          args: --timeout=3m

      - name: Validate test shard definitions
        run: scripts/ci/test-shards.sh check

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  staticcheck:
    name: Staticcheck (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: static

      # internal/web/dist/index.html is committed as an embed placeholder, so
      # vet/staticcheck work on a clean checkout without a built frontend.
      - name: Run go vet
        run: go vet ./...
        working-directory: backend

      # Temporary (#702): staticcheck v0.8.1 pins an x/tools that cannot read
      # go1.27.2 export data. Build it from an isolated module that raises only
      # x/tools; the tools module is not in go.work, so backend/go.mod is
      # untouched. Back to the plain `go run honnef.co/go/tools/cmd/staticcheck@<tag>`
      # form once staticcheck tags a release that supports go1.27.2.
      - name: Build staticcheck
        run: GOWORK=off go build -o "$RUNNER_TEMP/staticcheck" honnef.co/go/tools/cmd/staticcheck
        working-directory: backend/tools/staticcheck

      - name: Run staticcheck
        run: '"$RUNNER_TEMP/staticcheck" ./...'
        working-directory: backend

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  govulncheck:
    name: Govulncheck (Backend)
    runs-on: ubuntu-latest
    needs: changes
    # Only when Go modules change; govulncheck-nightly.yml covers new advisories
    # against unchanged dependencies.
    if: needs.changes.outputs.gomod == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: vuln

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: backend

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Regenerate API client and mocks
        run: bun run gen:api
        working-directory: web

      - name: Fail if generated client/mocks are stale
        run: |
          git add -A -- web/src/api/generated web/src/api/model
          if ! git diff --cached --quiet -- web/src/api/generated web/src/api/model; then
            echo "::error::web/src/api/generated or web/src/api/model is out of date with docs/openapi.yaml."
            echo "Run 'bun run gen:api' in web/ and commit the result."
            git diff --cached --stat -- web/src/api/generated web/src/api/model
            exit 1
          fi

      - name: Lint
        run: bun run lint
        working-directory: web

  test-frontend:
    name: Test (Frontend, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # The count also appears in the job name, in --shard below and in the
        # number of reports test-frontend-coverage expects.
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      # A shard sees a third of the suite, so it records coverage in a blob
      # report and checks no threshold; test-frontend-coverage does.
      - name: Run tests
        run: bun run test:shard --shard="$SHARD/3"
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}

      # .vitest is a hidden directory, which upload-artifact skips by default.
      - name: Upload blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: web/.vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-frontend-coverage:
    name: Test (Frontend, coverage)
    runs-on: ubuntu-latest
    needs: [changes, test-frontend]
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 5

    steps:
      # Depth 2: on pull_request HEAD^1 is the base the changed-lines check
      # compares against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: web/.vitest/blob
          merge-multiple: true

      # Runs no test: merges the shard reports and enforces the coverage
      # thresholds in web/vitest.config.ts on the whole suite.
      - name: Merge reports and enforce coverage thresholds
        run: |
          blobs=(.vitest/blob/blob-*.json)
          if ((${#blobs[@]} != 3)); then
            echo "::error::expected 3 shard reports, found ${#blobs[@]}"
            exit 1
          fi
          bun run test:merge
        working-directory: web

      # Warns, never fails: see "Changed-lines coverage" in docs/TESTING.md.
      - name: Check changed-lines coverage
        if: github.event_name == 'pull_request'
        run: scripts/ci/changed-lines-coverage.sh lcov web/coverage/lcov.info HEAD^1

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: web/coverage
          retention-days: 7

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      # Depth 2: on pull_request HEAD^1 is the base the changed-lines check
      # compares against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: cover

      - name: Run tests
        # -coverpkg attributes coverage to the package under test, not just
        # the package the test file lives in: most handler packages here are
        # exercised through internal/api's router-level integration tests, so
        # per-package-only coverage (the previous default) undercounted them.
        # coverpkg.sh lists ./... minus test-only helper packages. One job,
        # not shards: after #401 the whole run takes about as long as the
        # slowest former shard and matches its merged coverage (see
        # docs/TESTING.md).
        run: go test -timeout 8m -coverpkg="$(../scripts/ci/coverpkg.sh)" -coverprofile=coverage.out ./...
        working-directory: backend

      - name: Enforce coverage baseline
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 < 80) ? 1 : 0 }'
        working-directory: backend

      # Warns, never fails: see "Changed-lines coverage" in docs/TESTING.md.
      - name: Check changed-lines coverage
        if: github.event_name == 'pull_request'
        run: scripts/ci/changed-lines-coverage.sh go backend/coverage.out HEAD^1

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: backend/coverage.out
          retention-days: 7

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  test-backend-race:
    name: Test (Backend, race, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.race_shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every shard saves its own cache: the build cache also holds the test
      # results that let an unchanged package report (cached).
      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: race
          shard: ${{ matrix.shard }}

      - name: Run race-sensitive tests
        run: scripts/ci/test-shards.sh run race "$SHARD" -timeout 8m -race
        env:
          SHARD: ${{ matrix.shard }}

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  test-backend-postgres:
    name: Test (Backend, Postgres, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.postgres_shards) }}
    env:
      WISELABZ_TEST_POSTGRES_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

    steps:
      # Postgres starts here, in the background, so the pull and the boot
      # overlap with checkout and Setup Go; a `services:` container would
      # finish initializing before the first step. Same postgres:16 image.
      # The data directory is a tmpfs and fsync is off: nothing here has to
      # survive a crash, and the store tests write a lot.
      - name: Start Postgres
        run: |
          setsid nohup docker run -d --name postgres --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_USER=wiselabz -e POSTGRES_PASSWORD=wiselabz -e POSTGRES_DB=wiselabz \
            -p 5432:5432 postgres:16 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            >"$RUNNER_TEMP/postgres-start.log" 2>&1 &

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: postgres

      # Each shard decides for itself, so no job sits between Detect changes
      # and the Postgres shards. Go is set up by now, and the container is
      # still starting.
      - name: Postgres test closure
        id: closure
        env:
          FILES: ${{ needs.changes.outputs.files }}
          SHARD: ${{ matrix.shard }}
        run: |
          [[ $SHARD != b-g ]] || scripts/ci/changes.sh check --go
          # A job output over 1 MB is dropped. Without the list, run the shard.
          if [[ -z $FILES ]]; then
            echo "::warning::changed-file list unavailable; running the Postgres shard"
            echo "postgres=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.[]' <<<"$FILES" |
            CHANGES_SUMMARY="$GITHUB_STEP_SUMMARY" scripts/ci/changes.sh go-closure >> "$GITHUB_OUTPUT"

      - name: Wait for Postgres
        if: steps.closure.outputs.postgres == 'true'
        run: |
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -q -U wiselabz -d wiselabz; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Postgres did not become ready in 60s"
          cat "$RUNNER_TEMP/postgres-start.log"
          docker logs postgres || true
          exit 1

      - name: Run store tests and migration parity against Postgres
        if: steps.closure.outputs.postgres == 'true'
        run: scripts/ci/test-shards.sh run postgres "$SHARD" -timeout 8m -p 1
        env:
          SHARD: ${{ matrix.shard }}

      # Runs in one shard only; every shard has its own fresh Postgres.
      - name: Verify migrate up/status/verify on Postgres
        if: steps.closure.outputs.postgres == 'true' && matrix.shard == 'b-g'
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate verify
        working-directory: backend
        env:
          WISELABZ_DB_DRIVER: postgres
          WISELABZ_DB_DSN: postgres://wiselabz:wiselabz@localhost:5432/wiselabz?sslmode=disable

      - name: Save Go cache
        if: steps.closure.outputs.postgres == 'true' && matrix.shard == 'b-g'
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Independent of lint/tests: CI Status aggregates every result.
    needs: changes
    if: (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && needs.changes.outputs.draft != 'true'
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/bun-setup

      - name: Setup Go
        id: go
        uses: ./.github/actions/go-cache-restore
        with:
          kind: build

      - name: Build frontend
        run: bun run build
        working-directory: web

      - name: Copy frontend assets
        run: |
          mkdir -p backend/internal/web/dist
          cp -r web/dist/. backend/internal/web/dist/

      - name: Build backend binary
        run: go build -o /dev/null ./cmd/server
        working-directory: backend
        env:
          CGO_ENABLED: "0"

      - name: Save Go cache
        uses: ./.github/actions/go-cache-save
        with:
          prefix: ${{ steps.go.outputs.prefix }}
          paths: ${{ steps.go.outputs.paths }}

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.compose == 'true' && needs.changes.outputs.draft != 'true'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layer cache is written from main only and restored by PRs, like the Go
      # caches, to stay within the repository cache quota. Each export leaves
      # the previous commit's layers behind; the daily Cache cleanup sweep
      # deletes them. Its rule relies on the export looking up every layer, so
      # do not add `ghtoken` or `repository` to cache-to
      # (scripts/ci/cache-prune.sh).
      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: wiselabz:compose-smoke
          cache-from: type=gha,scope=compose-smoke
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,scope=compose-smoke,mode=max' || '' }}

      - name: Migrate, boot, authenticate, and create a connector
        run: scripts/compose-smoke.sh
        env:
          COMPOSE_SMOKE_PREBUILT: "1"

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - actionlint
      - lint-backend
      - staticcheck
      - govulncheck
      - lint-frontend
      - test-frontend
      - test-frontend-coverage
      - test-backend
      - test-backend-race
      - test-backend-postgres
      - build
      - compose-smoke
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check overall status
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            if .changes.result != "success" then
              error("Detect changes must succeed; got \(.changes.result)")
            else . end
            | . as $needs
            | .changes.outputs as $outputs
            | [
                (if $outputs.workflows == "true" then "actionlint" else empty end),
                (if $outputs.draft != "true" then
                  (if $outputs.backend == "true" then
                    "lint-backend", "staticcheck", "test-backend", "test-backend-race",
                    # A shard that finds nothing in the closure still succeeds.
                    "test-backend-postgres"
                  else empty end),
                  (if $outputs.frontend == "true" then
                    "lint-frontend", "test-frontend", "test-frontend-coverage"
                  else empty end),
                  (if $outputs.gomod == "true" then "govulncheck" else empty end),
                  (if $outputs.backend == "true" or $outputs.frontend == "true" then "build" else empty end),
                  (if $outputs.compose == "true" then "compose-smoke" else empty end)
                else empty end)
              ] as $required
            | [
                ($required[] | select($needs[.].result != "success")
                  | "\(.): expected success, got \($needs[.].result)"),
                (to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")
                  | "\(.key): \(.value.result)")
              ]
            | if length > 0 then error(join("; ")) else true end
          ' <<<"$NEEDS"
          echo "All required jobs passed (or were correctly skipped by the path filter)."
