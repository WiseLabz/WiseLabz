# Monthly dependency updates, at most two PRs per ecosystem: every PR costs a
# CI run, and each merge makes the others re-run in the merge queue. The
# cooldown skips releases younger than a week, which are often re-patched.
# Security updates ignore the schedule and cooldown. The commit prefixes pass
# the lefthook commit-msg check and stay out of the changelog (release-please
# hides ci and chore). See "What CI runs" in docs/TESTING.md.
version: 2
updates:
  # "/" only scans .github/workflows, so the composite actions are listed too.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels: ["area:platform"]
    open-pull-requests-limit: 5

  # Majors are grouped apart from minor and patch, so one breaking upgrade
  # never holds back the routine bumps.
  - package-ecosystem: gomod
    directory: "/backend"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]
      go-major:
        update-types: [major]
    commit-message:
      prefix: chore
      include: scope
    labels: ["area:backend"]
    open-pull-requests-limit: 5

  - package-ecosystem: bun
    directory: "/web"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: [minor, patch]
      web-major:
        update-types: [major]
    commit-message:
      prefix: chore
      include: scope
    labels: ["area:frontend"]
    open-pull-requests-limit: 5
