name: Setup Go with per-kind cache
description: >
  Installs Go and restores the module + build cache for one kind of job
  (race, cover, lint, ...). Build caches differ per kind (-race and -cover
  instrument every package), so a single shared cache would only ever hold
  whichever kind saved first. Pair with go-cache-save, which saves on main only.

inputs:
  kind:
    description: Cache kind, e.g. race, cover, lint.
    required: true
  shard:
    description: >
      Shard name, for a kind whose matrix jobs each save a cache (race). A
      shard restores its own cache first, then any cache of the kind.
    required: false
    default: ""

outputs:
  prefix:
    description: Cache key prefix; pass to go-cache-save.
    value: ${{ steps.key.outputs.prefix }}
  paths:
    description: Cached paths; pass to go-cache-save.
    value: ${{ steps.key.outputs.paths }}

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: backend/go.mod
        cache: false

    - name: Compute cache key
      id: key
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        SHARD: ${{ inputs.shard }}
        GO_SUM_HASH: ${{ hashFiles('backend/go.sum') }}
      run: |
        base="go-$KIND-$RUNNER_OS-$(go env GOVERSION)-"
        hashed="$base$GO_SUM_HASH-"
        {
          echo "prefix=$hashed${SHARD:+$SHARD-}"
          echo "hashed=$hashed"
          echo "base=$base"
          echo "paths<<EOF"
          go env GOMODCACHE GOCACHE
          # staticcheck keeps its analysis results in a cache of its own.
          if [[ $KIND == static ]]; then
            echo "${XDG_CACHE_HOME:-$HOME/.cache}/staticcheck"
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    # Keys end in the run id: main saves a fresh cache each run and PRs restore
    # the newest one by prefix. A shard falls back to its siblings' caches,
    # which share the compiled dependencies. Then to other go.sum hashes, since
    # most of the build cache survives a dependency bump.
    - name: Restore Go cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.paths }}
        key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}
          ${{ steps.key.outputs.hashed }}
          ${{ steps.key.outputs.base }}
